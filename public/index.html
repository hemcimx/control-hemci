<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bitácora de negocio</title>
<style>
  :root {
    --ink: #1F2A3C;
    --ink-soft: #45526B;
    --paper: #ECEFE1;
    --paper-dark: #DEE4CC;
    --paper-line: #C6D0B4;
    --stamp-red: #9C3B2E;
    --stamp-amber: #B4791F;
    --stamp-green: #3F6B4A;
    --brass: #A9812E;
    --text-muted: #6B7566;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-mono: 'Courier New', Courier, monospace;
    --font-body: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); }
  body { font-family: var(--font-body); color: var(--ink); }
  .ledger-app { display: flex; min-height: 100vh; }
  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 100vh; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--paper-dark); border-top-color: var(--brass); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--ink); color: var(--paper); padding: 20px 0 20px 14px; display: flex; flex-direction: column; gap: 24px; }
  .brand { display: flex; gap: 10px; align-items: flex-start; padding-right: 14px; }
  .brand-mark { font-family: var(--font-display); font-size: 28px; color: var(--brass); line-height: 1; }
  .brand-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.65; }
  .brand-input { background: transparent; border: none; border-bottom: 1px dashed rgba(236,239,225,0.4); color: var(--paper); font-family: var(--font-display); font-size: 16px; padding: 2px 0; width: 100%; }
  .brand-input:focus { outline: none; border-bottom-color: var(--brass); }
  .tabs { display: flex; flex-direction: column; gap: 4px; }
  .tab { display: flex; align-items: center; gap: 10px; background: transparent; border: none; color: rgba(236,239,225,0.75); font-family: var(--font-body); font-size: 14px; text-align: left; padding: 10px 14px; border-radius: 8px 0 0 8px; cursor: pointer; margin-right: -1px; }
  .tab:hover { background: rgba(236,239,225,0.08); color: var(--paper); }
  .tab-active { background: var(--paper); color: var(--ink); font-weight: 600; }
  .content { flex: 1; padding: 22px 28px; overflow-x: auto; position: relative; background-image: repeating-linear-gradient(to bottom, transparent, transparent 27px, var(--paper-line) 28px); }
  .panel-title { font-family: var(--font-display); font-size: 24px; margin: 0 0 16px; letter-spacing: 0.01em; }
  .card-title { margin-top: 0; font-family: var(--font-display); font-size: 16px; }
  .card { background: rgba(255,255,255,0.55); border: 1px solid var(--paper-line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 16px; align-items: end; }
  .form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-soft); }
  .form-grid .span-2 { grid-column: span 2; }
  input, select { font-family: var(--font-body); font-size: 14px; padding: 7px 9px; border: 1px solid var(--paper-line); border-radius: 6px; background: #fff; color: var(--ink); width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
  .btn-primary, .btn-secondary { display: inline-flex; align-items: center; gap: 6px; justify-content: center; font-family: var(--font-body); font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 6px; cursor: pointer; border: none; }
  .btn-primary { background: var(--ink); color: var(--paper); grid-column: span 2; }
  .btn-primary:hover { background: var(--ink-soft); }
  .btn-secondary { background: transparent; border: 1px solid var(--ink); color: var(--ink); margin-top: 8px; }
  .btn-secondary:hover { background: var(--paper-dark); }
  .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 12px; flex-wrap: wrap; }
  .total-chip { font-family: var(--font-mono); font-weight: 700; background: var(--paper-dark); padding: 6px 10px; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 1px solid var(--paper-line); padding: 6px 8px; }
  td { padding: 8px; border-bottom: 1px solid var(--paper-line); }
  .mono { font-family: var(--font-mono); }
  .amount { color: var(--brass); font-weight: 700; }
  .empty { color: var(--text-muted); font-style: italic; padding: 10px 0; margin: 0; }
  .icon-btn { background: transparent; border: none; cursor: pointer; color: var(--text-muted); padding: 4px 8px; border-radius: 4px; font-size: 14px; }
  .icon-btn:hover { background: var(--paper-dark); color: var(--stamp-red); }
  .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .stamp { display: inline-block; font-family: var(--font-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; border-radius: 4px; padding: 2px 6px; transform: rotate(-3deg); opacity: 0.85; mix-blend-mode: multiply; border-width: 2px; border-style: solid; }
  .stamp-pendiente { color: var(--stamp-red); border-color: var(--stamp-red); }
  .stamp-en_proceso { color: var(--stamp-amber); border-color: var(--stamp-amber); }
  .stamp-hecho { color: var(--stamp-green); border-color: var(--stamp-green); }
  .stamp-cancelada { color: var(--text-muted); border-color: var(--text-muted); }
  .priority { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; }
  .priority-alta { color: var(--stamp-red); }
  .priority-media { color: var(--brass); }
  .priority-baja { color: var(--stamp-green); }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 12px; color: var(--ink-soft); }
  .check-row input { width: auto; }
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .board-col { background: rgba(255,255,255,0.4); border: 1px solid var(--paper-line); border-radius: 10px; padding: 10px; min-height: 100px; }
  .board-col-head { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin-bottom: 10px; display: flex; justify-content: space-between; }
  .count { font-family: var(--font-mono); background: var(--paper-dark); padding: 1px 6px; border-radius: 10px; }
  .board-col-body { display: flex; flex-direction: column; gap: 10px; }
  .task-card { background: #fff; border: 1px solid var(--paper-line); border-radius: 8px; padding: 10px 12px; }
  .task-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .task-card h4 { margin: 0 0 4px; font-family: var(--font-display); font-size: 15px; }
  .task-project { font-size: 11px; color: var(--brass); font-weight: 600; margin-bottom: 4px; }
  .task-desc { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; }
  .task-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .overdue { color: var(--stamp-red); font-weight: 700; }
  .progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .progress-row input[type=range] { flex: 1; accent-color: var(--brass); width: auto; }
  .task-actions { display: flex; justify-content: space-between; align-items: center; }
  .link-btn { background: none; border: none; color: var(--ink-soft); font-size: 11px; text-decoration: underline; cursor: pointer; padding: 0; }
  .toast { position: absolute; top: 14px; right: 28px; background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; z-index: 10; }
  .toast-error { background: var(--stamp-red); }
  .member-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .hint { font-size: 12px; color: var(--text-muted); margin: 0 0 12px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stat-card { background: rgba(255,255,255,0.55); border: 1px solid var(--paper-line); border-radius: 10px; padding: 14px 16px; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
  .stat-value { font-family: var(--font-mono); font-size: 26px; font-weight: 700; margin-top: 4px; }
  .cat-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; flex-wrap: wrap; }
  .cat-bar-track { flex: 1; height: 8px; background: var(--paper-dark); border-radius: 4px; overflow: hidden; min-width: 60px; }
  .cat-bar-fill { height: 100%; background: var(--brass); }
  .cat-bar-fill-warn { background: var(--stamp-amber); }
  .cat-bar-fill-over { background: var(--stamp-red); }
  .cat-bar-label { width: 130px; flex-shrink: 0; }
  .cat-bar-value { min-width: 80px; text-align: right; }
  .feed-item { font-size: 13px; padding: 8px 0; border-bottom: 1px dashed var(--paper-line); }
  .feed-item:last-child { border-bottom: none; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .confirm-panel { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; vertical-align: middle; flex-wrap: wrap; }
  .confirm-panel select { width: auto; }
  .confirm-error { color: var(--stamp-red); font-size: 11px; }
  .member-pin-row { display: flex; align-items: center; gap: 8px; margin: 2px 0 14px; flex-wrap: wrap; }
  .report-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .report-card { max-width: 480px; width: 100%; background: rgba(255,255,255,0.7); border: 1px solid var(--paper-line); border-radius: 12px; padding: 24px; }
  .report-card label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; }
  .report-card input, .report-card select, .report-card textarea { width: 100%; margin-top: 4px; font-family: var(--font-body); font-size: 14px; padding: 8px 9px; border: 1px solid var(--paper-line); border-radius: 6px; background: #fff; color: var(--ink); resize: vertical; }
  .report-success { background: var(--stamp-green); color: #fff; border-radius: 6px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
  @media (max-width: 760px) {
    .ledger-app { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 12px 14px; gap: 14px; overflow-x: auto; }
    .brand { padding-right: 0; }
    .tabs { flex-direction: row; }
    .tab { border-radius: 8px; margin-right: 0; white-space: nowrap; }
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .span-2 { grid-column: span 1; }
    .btn-primary { grid-column: span 1; }
    .board { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr; }
    .content { overflow-x: hidden; padding: 16px; }
    .cat-bar-label { width: 90px; font-size: 11px; }
    .cat-bar-value { min-width: 64px; font-size: 11px; }
    table, table thead, table tbody, table th, table td, table tr { display: block; width: 100%; }
    table thead { position: absolute; left: -9999px; top: -9999px; }
    table tr { border: 1px solid var(--paper-line); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; background: #fff; }
    table td { border: none; padding: 6px 0; }
    table td[data-label]:not([data-label=""])::before {
      content: attr(data-label);
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .confirm-panel { display: flex; margin-left: 0; margin-top: 6px; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="app"></div>
<script>
  var CATEGORIES = ["Insumos", "Servicios y suscripciones", "Renta", "Nómina", "Marketing", "Transporte", "Equipo y herramientas", "Impuestos", "Otro"];
  var PRIORITIES = [{id:"alta",label:"Alta"},{id:"media",label:"Media"},{id:"baja",label:"Baja"}];
  var PRIORITY_ORDER = { alta: 0, media: 1, baja: 2 };
  var STATUS_META = {
    pendiente: { label: "Pendiente" },
    en_proceso: { label: "En proceso" },
    hecho: { label: "Hecho" },
    cancelada: { label: "Cancelada" }
  };

  var state = {
    tab: "resumen",
    team: [],
    expenses: [],
    tasks: [],
    contributions: [],
    settings: { companyName: "Nuestro Negocio" },
    budgets: {},
    auditLog: [],
    tickets: [],
    notas: [],
    notaDraft: null,
    loading: true,
    notice: null,
    gastosMonthFilter: new Date().toISOString().slice(0,7),
    historialMonthFilter: "",
    tareasShowCancelled: false
  };
  if (window.matchMedia && window.matchMedia("(max-width: 760px)").matches) {
    state.tab = "mis-pendientes";
  }

  function uid() {
    return (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));
  }
  function currency(n) {
    return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" }).format(n || 0);
  }
  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }
  function formatDateMX(isoDate) {
    if (!isoDate || isoDate.length < 10) return isoDate || "—";
    var parts = isoDate.slice(0, 10).split("-");
    if (parts.length !== 3) return isoDate;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }
  function formatDateTimeMX(ts) {
    var d = new Date(ts);
    var pad = function(n){ return String(n).padStart(2, "0"); };
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + ", " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function memberName(id) {
    if (id === "ambos") return "Ambos";
    var m = state.team.find(function(x){ return x.id === id; });
    return m ? m.name : "Sin asignar";
  }

  async function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    var buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
  }

  function getMyIdentity() {
    try { return localStorage.getItem("hemci-my-id") || null; } catch (e) { return null; }
  }
  function setMyIdentity(id) {
    try { localStorage.setItem("hemci-my-id", id); } catch (e) {}
  }
  function clearMyIdentity() {
    try { localStorage.removeItem("hemci-my-id"); } catch (e) {}
  }

  function isFullyConfirmed(entry) {
    var confirmedBy = entry.confirmedBy || [];
    return state.team.length > 0 && state.team.every(function(m){ return confirmedBy.indexOf(m.id) !== -1; });
  }
  function confirmStampHTML(entry) {
    var confirmedBy = entry.confirmedBy || [];
    if (isFullyConfirmed(entry)) return '<span class="stamp stamp-hecho">Confirmada</span>';
    if (confirmedBy.length === 0) return '<span class="stamp stamp-pendiente">Pendiente</span>';
    var missing = state.team.filter(function(m){ return confirmedBy.indexOf(m.id) === -1; }).map(function(m){ return m.name; }).join(", ");
    return '<span class="stamp stamp-en_proceso">Falta: ' + escapeHtml(missing) + '</span>';
  }
  function confirmControlHTML(entry, kind) {
    var confirmedBy = entry.confirmedBy || [];
    var pending = state.team.filter(function(m){ return confirmedBy.indexOf(m.id) === -1; });
    if (pending.length === 0) return "";
    var rowId = kind + "-" + entry.id;
    var options = pending.map(function(m){ return '<option value="' + m.id + '">' + escapeHtml(m.name) + '</option>'; }).join("");
    return (
      '<button type="button" class="link-btn" data-toggle-confirm="' + rowId + '">Confirmar</button>' +
      '<div class="confirm-panel" id="confirm-panel-' + rowId + '" style="display:none">' +
        '<select id="confirm-member-' + rowId + '">' + options + '</select>' +
        '<input type="password" inputmode="numeric" maxlength="4" placeholder="Clave" id="confirm-pin-' + rowId + '" style="max-width:90px;" />' +
        '<button type="button" class="btn-secondary" data-confirm-submit="' + rowId + '" data-confirm-id="' + entry.id + '" data-confirm-kind="' + kind + '">OK</button>' +
        '<span class="confirm-error" id="confirm-error-' + rowId + '"></span>' +
      '</div>'
    );
  }
  async function confirmEntry(kind, id, memberId, pin) {
    var member = state.team.find(function(m){ return m.id === memberId; });
    if (!member) return { ok: false, error: "Integrante no encontrado." };
    if (!member.pinHash) return { ok: false, error: "Sin clave configurada (ve a Equipo)." };
    var hash = await sha256Hex(pin);
    if (hash !== member.pinHash) return { ok: false, error: "Clave incorrecta." };
    var list = kind === "expenses" ? state.expenses : state.contributions;
    var target = list.find(function(item){ return item.id === id; });
    var next = list.map(function(item){
      if (item.id !== id) return item;
      var confirmedBy = item.confirmedBy || [];
      if (confirmedBy.indexOf(memberId) === -1) confirmedBy = confirmedBy.concat([memberId]);
      return Object.assign({}, item, { confirmedBy: confirmedBy });
    });
    if (kind === "expenses") { state.expenses = next; await saveKey("expenses", next); }
    else { state.contributions = next; await saveKey("contributions", next); }
    flash("Confirmado.");
    if (target) logActivity(member.name + " confirmó " + (kind === "expenses" ? "un gasto" : "una aportación") + " de " + currency(target.amount));
    renderTabContent();
    return { ok: true };
  }
  function bindConfirmEvents() {
    document.querySelectorAll("[data-toggle-confirm]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var panel = document.getElementById("confirm-panel-" + btn.dataset.toggleConfirm);
        if (panel) panel.style.display = (panel.style.display === "none") ? "flex" : "none";
      });
    });
    document.querySelectorAll("[data-confirm-submit]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var rowId = btn.dataset.confirmSubmit;
        var entryId = btn.dataset.confirmId;
        var kind = btn.dataset.confirmKind;
        var memberSel = document.getElementById("confirm-member-" + rowId);
        var pinInput = document.getElementById("confirm-pin-" + rowId);
        var errorSlot = document.getElementById("confirm-error-" + rowId);
        var pin = pinInput.value.trim();
        errorSlot.textContent = "";
        if (!/^\d{4}$/.test(pin)) { errorSlot.textContent = "Clave de 4 dígitos."; return; }
        var result = await confirmEntry(kind, entryId, memberSel.value, pin);
        if (!result.ok) errorSlot.textContent = result.error;
      });
    });
  }

  var API_BASE = "/betoalex/api/data/";
  var AUTH_BASE = "/betoalex/api/auth/";
  var PUBLIC_BASE = "/betoalex/api/public/";

  async function loadKey(key, fallback) {
    try {
      var res = await fetch(API_BASE + key, { credentials: "same-origin" });
      if (res.status === 401) { handleSessionExpired(); return fallback; }
      if (!res.ok) return fallback;
      var val = await res.json();
      return (val === null || val === undefined) ? fallback : val;
    } catch (e) { return fallback; }
  }
  async function saveKey(key, value) {
    try {
      var res = await fetch(API_BASE + key, {
        method: "POST",
        credentials: "same-origin",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(value)
      });
      if (res.status === 401) { handleSessionExpired(); return false; }
      return res.ok;
    } catch (e) { return false; }
  }
  function handleSessionExpired() {
    if (state.sessionExpiredHandled) return;
    state.sessionExpiredHandled = true;
    renderLogin("Tu sesión expiró. Vuelve a entrar.");
  }

  function isStrongPasswordClient(pw) {
    return typeof pw === "string" && pw.length >= 10 && /[a-z]/.test(pw) && /[A-Z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw);
  }
  function wirePasswordHint(inputId, hintId) {
    var input = document.getElementById(inputId);
    var hint = document.getElementById(hintId);
    if (!input || !hint) return;
    input.addEventListener("input", function(){
      if (!input.value) { hint.style.color = "var(--text-muted)"; return; }
      hint.style.color = isStrongPasswordClient(input.value) ? "var(--stamp-green)" : "var(--stamp-red)";
    });
  }

  function logActivity(text) {
    var actorId = getMyIdentity();
    var actor = actorId ? memberName(actorId) : "Alguien";
    var entry = { ts: Date.now(), actor: actor, text: text };
    state.auditLog = [entry].concat(state.auditLog).slice(0, 200);
    saveKey("auditlog", state.auditLog);
  }

  function downloadCSV(filename, rows) {
    var csv = rows.map(function(row){
      return row.map(function(cell){
        var s = String(cell == null ? "" : cell);
        if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
        return s;
      }).join(",");
    }).join("\r\n");
    var blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function readAndCompressImage(file, maxDim, quality) {
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("No se pudo leer la imagen.")); };
      reader.onload = function(){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, cw, ch);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = function(){ reject(new Error("Imagen inválida.")); };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function loadTeamStrict() {
    try {
      var res = await fetch(API_BASE + "team");
      if (!res.ok) return { failed: true, value: null };
      var val = await res.json();
      return { failed: false, value: val };
    } catch (e) { return { failed: true, value: null }; }
  }

  async function init() {
    var teamResult = await loadTeamStrict();
    var results = await Promise.all([
      loadKey("expenses", []),
      loadKey("tasks", []),
      loadKey("settings", { companyName: "Nuestro Negocio" }),
      loadKey("contributions", []),
      loadKey("budgets", {}),
      loadKey("auditlog", []),
      loadKey("tickets", []),
      loadKey("notas", [])
    ]);
    var expenses = results[0], tasks = results[1], settings = results[2], contributions = results[3], budgets = results[4], auditLog = results[5], tickets = results[6], notas = results[7];
    var team = teamResult.value;
    if (teamResult.failed) {
      // No se pudo confirmar si hay equipo guardado (falla de red/servidor).
      // NUNCA sobrescribir en este caso — solo mostrar lo que haya en memoria y avisar.
      team = team || [];
      state.loadError = true;
    } else if (!team || team.length === 0) {
      // Confirmado: de verdad no hay equipo guardado todavía (primera vez). Seguro sembrar.
      team = [{ id: uid(), name: "Socio 1" }, { id: uid(), name: "Socio 2" }];
      await saveKey("team", team);
    }
    state.team = team;
    state.expenses = expenses;
    state.tasks = tasks;
    state.contributions = contributions;
    state.settings = settings;
    state.budgets = budgets || {};
    state.auditLog = auditLog || [];
    state.tickets = tickets || [];
    state.notas = notas || [];
    state.loading = false;
    render();
    if (state.loadError) {
      flash("No se pudo confirmar el equipo guardado (problema de conexión). No se sobrescribió nada — recarga la página antes de hacer cambios.", true);
    }
  }

  function flash(msg, isError) {
    state.notice = { msg: msg, isError: isError };
    renderNotice();
    setTimeout(function(){ state.notice = null; renderNotice(); }, 3000);

    var item = Object.assign({}, exp, { id: id, createdAt: Date.now(), confirmedBy: [], hasReceipt: !!photoDataUrl });
    state.expenses = [item].concat(state.expenses);
    var ok = await saveKey("expenses", state.expenses);
    if (photoDataUrl) await saveKey("receipt:" + id, photoDataUrl);
    flash(ok ? "Gasto registrado." : "No se pudo guardar el gasto.", !ok);
    logActivity("Gasto de " + currency(item.amount) + " en " + item.category + " registrado" + (photoDataUrl ? " (con recibo)" : ""));
    renderTabContent();
  }
  async function deleteExpense(id) {
    var removed = state.expenses.find(function(x){ return x.id === id; });
    state.expenses = state.expenses.filter(function(x){ return x.id !== id; });
    await saveKey("expenses", state.expenses);
    if (removed) logActivity("Gasto eliminado: " + currency(removed.amount) + " (" + removed.category + ")");
    renderTabContent();
  }
  async function addTask(task) {
    var item = Object.assign({}, task, { id: uid(), createdAt: Date.now(), updatedAt: Date.now() });
    state.tasks = [item].concat(state.tasks);
    var ok = await saveKey("tasks", state.tasks);
    flash(ok ? "Tarea creada." : "No se pudo guardar la tarea.", !ok);
    logActivity('Tarea creada: "' + item.title + '" (asignada a ' + memberName(item.assignee) + ")");
    renderTabContent();
  }
  async function updateTask(id, patch) {
    var before = state.tasks.find(function(t){ return t.id === id; });
    state.tasks = state.tasks.map(function(t){ return t.id === id ? Object.assign({}, t, patch, { updatedAt: Date.now() }) : t; });
    await saveKey("tasks", state.tasks);
    if (before && patch.status && patch.status !== before.status) {
      var verb = patch.status === "hecho" ? "marcada como hecha" : patch.status === "cancelada" ? "cancelada" : patch.status === "pendiente" ? "reactivada" : "actualizada";
      logActivity('Tarea "' + before.title + '" ' + verb);
    }
    renderTabContent();
  }
  async function deleteTask(id) {
    var removed = state.tasks.find(function(t){ return t.id === id; });
    state.tasks = state.tasks.filter(function(t){ return t.id !== id; });
    await saveKey("tasks", state.tasks);
    if (removed) logActivity('Tarea eliminada: "' + removed.title + '"');
    renderTabContent();
  }
  async function addContribution(c) {
    var item = Object.assign({}, c, { id: uid(), createdAt: Date.now(), confirmedBy: [] });
    state.contributions = [item].concat(state.contributions);

  // ---------- Resumen ----------
  function resumenHTML() {
    var monthKey = todayISO().slice(0, 7);
    var confirmedExpenses = state.expenses.filter(isFullyConfirmed);
    var confirmedContributions = state.contributions.filter(isFullyConfirmed);
    var pendingExpenses = state.expenses.length - confirmedExpenses.length;
    var pendingContributions = state.contributions.length - confirmedContributions.length;
    var monthExpenses = confirmedExpenses.filter(function(e){ return e.date && e.date.slice(0,7) === monthKey; });
    var monthTotal = monthExpenses.reduce(function(s,e){ return s + Number(e.amount || 0); }, 0);
    var categoryTotals = {};
    monthExpenses.forEach(function(e){ categoryTotals[e.category] = (categoryTotals[e.category] || 0) + Number(e.amount || 0); });
    var topCategories = Object.entries(categoryTotals).sort(function(a,b){ return b[1]-a[1]; }).slice(0,5);
    var maxCat = topCategories.length ? topCategories[0][1] : 1;
    var active = state.tasks.filter(function(t){ return t.status !== "cancelada"; });
    var pendientes = state.tasks.filter(function(t){ return t.status === "pendiente"; }).length;
    var avgProgress = active.length ? Math.round(active.reduce(function(s,t){ return s + Number(t.progress || 0); }, 0) / active.length) : 0;
    var totalAportado = confirmedContributions.reduce(function(s,c){ return s + Number(c.amount || 0); }, 0);
    var totalGastadoTodo = confirmedExpenses.reduce(function(s,e){ return s + Number(e.amount || 0); }, 0);
    var disponible = totalAportado - totalGastadoTodo;
    var upcoming = state.tasks.filter(function(t){ return t.dueDate && t.status !== "hecho" && t.status !== "cancelada"; })
      .sort(function(a,b){ return a.dueDate.localeCompare(b.dueDate); }).slice(0,5);
    var feed = state.expenses.map(function(e){ return { ts: e.createdAt || 0, text: "Gasto de " + currency(e.amount) + " en " + escapeHtml(e.category) }; })
      .concat(state.tasks.map(function(t){ return { ts: t.updatedAt || t.createdAt || 0, text: escapeHtml(t.title) + " — " + (STATUS_META[t.status] ? STATUS_META[t.status].label : "") + " (" + (t.progress||0) + "%)" }; }))
      .sort(function(a,b){ return b.ts - a.ts; }).slice(0,6);

    var openTickets = state.tickets.filter(function(t){ return t.status !== "resuelto"; }).length;

    return (
      '<h2 class="panel-title">Resumen</h2>' +
      (pendingExpenses + pendingContributions > 0 ?
        '<p class="hint">⚠ ' + (pendingExpenses + pendingContributions) + ' movimiento(s) esperando confirmación de clave — no cuentan todavía en los totales de abajo.</p>' : '') +
      (openTickets > 0 ?
        '<p class="hint">⚠ ' + openTickets + ' reporte(s) de soporte IT sin resolver — revisa la pestaña Soporte IT.</p>' : '') +
      '<div class="stat-grid">' +
        '<div class="stat-card"><div class="stat-label">Gastado este mes</div><div class="stat-value">' + currency(monthTotal) + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">Tareas pendientes</div><div class="stat-value">' + pendientes + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">Avance general</div><div class="stat-value">' + avgProgress + '%</div></div>' +
        '<div class="stat-card"><div class="stat-label">Capital disponible</div><div class="stat-value">' + currency(disponible) + '</div></div>' +
      '</div>' +
      '<div class="two-col">' +
        '<div class="card"><h3 class="card-title">Gastos por categoría</h3>' +
          (topCategories.length === 0 ? '<p class="empty">Sin gastos este mes.</p>' :
            topCategories.map(function(entry){
              var cat = entry[0], val = entry[1];
              var budget = state.budgets[cat];
              var fillClass = "";
              if (budget) fillClass = val > budget ? " cat-bar-fill-over" : (val / budget >= 0.8 ? " cat-bar-fill-warn" : "");
              return '<div class="cat-bar-row"><span class="cat-bar-label">' + escapeHtml(cat) + '</span>' +
                '<div class="cat-bar-track"><div class="cat-bar-fill' + fillClass + '" style="width:' + ((val/maxCat)*100) + '%"></div></div>' +
                '<span class="cat-bar-value mono">' + currency(val) + (budget ? ' / ' + currency(budget) : '') + '</span></div>';
            }).join("")) +
        '</div>' +
        '<div class="card"><h3 class="card-title">Próximas fechas límite</h3>' +
          (upcoming.length === 0 ? '<p class="empty">No hay fechas próximas.</p>' :
            upcoming.map(function(t){
              return '<div class="feed-item"><strong>' + escapeHtml(t.title) + '</strong> — ' + escapeHtml(memberName(t.assignee)) +
                '<span class="mono" style="float:right">' + formatDateMX(t.dueDate) + '</span></div>';
            }).join("")) +
        '</div>' +
      '</div>' +
      '<div class="card"><h3 class="card-title">Actividad reciente</h3>' +
        (feed.length === 0 ? '<p class="empty">Todavía no hay movimientos.</p>' : feed.map(function(f){ return '<div class="feed-item">' + f.text + '</div>'; }).join("")) +
      '</div>'
    );
  }

  // ---------- Mis pendientes ----------
  function misPendientesHTML() {
    var myId = getMyIdentity();
    var me = myId ? state.team.find(function(m){ return m.id === myId; }) : null;
    if (!me) {
      var buttons = state.team.map(function(m){
        return '<button type="button" class="btn-secondary" data-pick-identity="' + m.id + '">' + escapeHtml(m.name) + '</button>';
      }).join(" ");
      return (
        '<h2 class="panel-title">Mis pendientes</h2>' +
        '<div class="card">' +
          '<p class="hint">¿Quién eres? Elige tu nombre para ver solo tus pendientes, sin distracciones de las del otro.</p>' +
          '<div style="display:flex; gap:10px; flex-wrap:wrap;">' + buttons + '</div>' +
        '</div>'
      );
    }
    var myTasks = state.tasks.filter(function(t){ return (t.assignee === myId || t.assignee === "ambos") && (t.status === "pendiente" || t.status === "en_proceso"); });
    myTasks.sort(function(a, b){
      var pa = PRIORITY_ORDER[a.priority] != null ? PRIORITY_ORDER[a.priority] : 3;
      var pb = PRIORITY_ORDER[b.priority] != null ? PRIORITY_ORDER[b.priority] : 3;
      if (pa !== pb) return pa - pb;
      if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
      if (a.dueDate) return -1;
      if (b.dueDate) return 1;
      return 0;
    });
    var toApprove = state.tasks.filter(function(t){ return t.awaitingApproval && t.assignee !== myId; });
    return (
      '<div class="list-header"><h2 class="panel-title" style="margin:0;">Pendientes de ' + escapeHtml(me.name) + '</h2>' +
      '<button type="button" class="btn-secondary" id="change-identity-btn">No soy yo, cambiar</button></div>' +
      (myTasks.length === 0 ? '<p class="empty">No tienes tareas pendientes.</p>' :

      (toApprove.length > 0 ?

         '<p class="hint">Tus compañeros marcaron estas como terminadas — confírmalo con tu clave.</p>' +
         '<div class="board-col-body">' + toApprove.map(approveCardHTML).join("") + '</div>') : '')
    );
  }

              '<td class="mono amount" data-label="Monto">' + currency(e.amount) + '</td>' +

  function bindGastosEvents() {
    document.getElementById("expense-form").addEventListener("submit", async function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      var amount = Number(fd.get("amount"));
      if (!amount || amount <= 0) return;
      var fileInput = document.getElementById("expense-photo-input");
      var photoDataUrl = null;
      if (fileInput && fileInput.files && fileInput.files[0]) {
        try {
          photoDataUrl = await readAndCompressImage(fileInput.files[0], 1200, 0.7);
        } catch (err) {
          flash("No se pudo procesar la foto, se guardó el gasto sin ella.", true);
        }
      }
      addExpense({
        amount: amount,
        category: fd.get("category"),
        paidBy: fd.get("paidBy"),
        date: fd.get("date") || todayISO(),
        description: (fd.get("description") || "").trim()
      }, photoDataUrl);
    });
    document.getElementById("month-filter").addEventListener("change", function(e){
      state.gastosMonthFilter = e.target.value;
      renderTabContent();
    });
    document.querySelectorAll("[data-delete-expense]").forEach(function(btn){
      btn.addEventListener("click", function(){ deleteExpense(btn.dataset.deleteExpense); });
    });
    document.querySelectorAll("[data-view-receipt]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.dataset.viewReceipt;
        var container = document.getElementById("receipt-" + id);
        if (!container) return;
        if (container.style.display !== "none") { container.style.display = "none"; return; }
        if (!container.dataset.loaded) {
          container.textContent = "Cargando…";
          container.style.display = "block";
          var dataUrl = await loadKey("receipt:" + id, null);
          container.textContent = "";
          if (dataUrl) {
            var img = document.createElement("img");
            img.src = dataUrl;
            img.style.maxWidth = "220px";

        var label = document.getElementById("progress-label-" + input.dataset.progress);
        if (label) label.textContent = e.target.value + "%";
      });
      input.addEventListener("change", function(e){
        var id = input.dataset.progress;
        var v = Number(e.target.value);
        var task = state.tasks.find(function(t){ return t.id === id; });
        if (v >= 100) {
          if (task && task.assignee === "ambos") {
            updateTask(id, { progress: v, status: "hecho", awaitingApproval: false });
            return;
          }
          var eligible = task ? state.team.filter(function(m){ return m.id !== task.assignee && m.pinHash; }) : [];
          if (eligible.length === 0) {
            updateTask(id, { progress: v, status: "hecho", awaitingApproval: false });
            flash("Se marcó como hecha SIN confirmación — el otro integrante no tiene clave configurada todavía (ve a Equipo).", true);
          } else {
            updateTask(id, { progress: v, status: "en_proceso", awaitingApproval: true });
            flash('Avance guardado. Queda esperando que el otro socio la autorice desde "Mis pendientes".');
          }
          return;
        }
        var status = v <= 0 ? "pendiente" : "en_proceso";
        updateTask(id, { progress: v, status: status, awaitingApproval: false });
      });
    });
    document.querySelectorAll("[data-cancel-task]").forEach(function(btn){
      btn.addEventListener("click", function(){ updateTask(btn.dataset.cancelTask, { status: "cancelada", awaitingApproval: false }); });
    });

    var year = parts.find(function(p){ return p.type === "year"; }).value;
    var month = parts.find(function(p){ return p.type === "month"; }).value;
    return year + "-" + month;
  }

  // ---------- Soporte IT ----------
  var URGENCY_ORDER = { "Alta": 0, "Media": 1, "Baja": 2 };
  function elapsedTimeMX(ts) {
    var mins = Math.floor((Date.now() - ts) / 60000);
    if (mins < 1) return "hace un momento";
    if (mins < 60) return "hace " + mins + " min";
    var hours = Math.floor(mins / 60);
    if (hours < 24) return "hace " + hours + " h";
    var days = Math.floor(hours / 24);
    return "hace " + days + " día" + (days === 1 ? "" : "s");
  }
  function ticketsHTML() {
    var open = state.tickets.filter(function(t){ return t.status !== "resuelto"; }).sort(function(a,b){
      var ua = URGENCY_ORDER[a.urgency] != null ? URGENCY_ORDER[a.urgency] : 3;
      var ub = URGENCY_ORDER[b.urgency] != null ? URGENCY_ORDER[b.urgency] : 3;
      if (ua !== ub) return ua - ub;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    var resolved = state.tickets.filter(function(t){ return t.status === "resuelto"; }).sort(function(a,b){ return (b.resolvedAt || 0) - (a.resolvedAt || 0); });
    var reportUrl = window.location.origin + "/reportar";

    function ticketCard(t) {
      var elapsed = elapsedTimeMX(t.createdAt);
      var urgClass = t.urgency === "Alta" ? "alta" : (t.urgency === "Baja" ? "baja" : "media");
      var teamOptions = state.team.map(function(m){ return '<option value="' + m.id + '"' + (m.id === t.assignedTo ? " selected" : "") + '>' + escapeHtml(m.name) + '</option>'; }).join("");

      var deviceHistoryCount = state.tickets.filter(function(o){
        return o.id !== t.id && o.device && t.device && o.device.trim().toLowerCase() === t.device.trim().toLowerCase();
      }).length;
      var historyBadge = deviceHistoryCount > 0

  function generateServiceOrderPDF(t) {
    if (!window.jspdf || !window.jspdf.jsPDF) { flash("No se pudo cargar el generador de PDF. Revisa tu conexión e intenta de nuevo.", true); return; }
    var doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter" });
    var pageWidth = doc.internal.pageSize.getWidth();
    var margin = 18;
    var y = 18;

    try { doc.addImage("data:image/jpeg;base64," + LOGO_HEMCI_B64, "JPEG", margin, y - 4, 24, 24); } catch (e) {}
    var textX = margin + 30;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(15);
    doc.setTextColor(31, 42, 60);
    doc.text("HEMCI", textX, y + 4);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);
    doc.setTextColor(107, 117, 102);
    doc.text("Hospital de Especialidades Médicas de la Ciénega", textX, y + 10);
    doc.text("Departamento de Soporte Técnico / IT", textX, y + 15);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.setTextColor(31, 42, 60);
    doc.text("Orden de Servicio", pageWidth - margin, y + 2, { align: "right" });
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.text("Folio: " + (t.folio || "—"), pageWidth - margin, y + 8, { align: "right" });
    doc.text("Fecha: " + formatDateTimeMX(t.createdAt), pageWidth - margin, y + 13, { align: "right" });

    y += 28;
    doc.setDrawColor(198, 208, 180);
    doc.line(margin, y, pageWidth - margin, y);
    y += 10;

    function field(label, value) {
      doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(69, 82, 107);
      doc.text(label, margin, y);
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(31, 42, 60);
      var lines = doc.splitTextToSize(String(value || "—"), pageWidth - margin * 2);
      doc.text(lines, margin, y + 5);
      y += 5 + (lines.length * 5) + 5;
    }

    field("Reportó:", t.reporterName);
    field("Área:", t.area || "—");
    field("Equipo / dispositivo:", t.device);
    field("Tipo de falla:", t.failureType);
    field("Urgencia:", t.urgency);
    field("Descripción del problema:", t.description);
    field("Atendió:", t.assignedTo ? memberName(t.assignedTo) : "—");
    field("Solución aplicada:", t.resolution || "Pendiente");
    field("Estado:", t.status === "resuelto" ? "Resuelto" : "Abierto");

    y += 14;
    doc.setDrawColor(140, 150, 130);
    doc.line(margin, y, margin + 70, y);
    doc.line(pageWidth - margin - 70, y, pageWidth - margin, y);
    y += 5;
    doc.setFontSize(9); doc.setTextColor(107, 117, 102);
    doc.text("Firma de quien reporta", margin, y);
    doc.text("Firma de quien atendió", pageWidth - margin - 70, y);

    doc.save((t.folio || "orden-servicio") + ".pdf");
  }
  function bindTicketsEvents() {
    document.querySelectorAll("[data-resolve-ticket]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.dataset.resolveTicket;
        var textarea = document.getElementById("resolution-" + id);
        var resolution = textarea ? textarea.value.trim() : "";
        if (!resolution) { flash("Escribe qué se hizo antes de marcar resuelto.", true); return; }
        var ticket = state.tickets.find(function(t){ return t.id === id; });
        state.tickets = state.tickets.map(function(t){ return t.id === id ? Object.assign({}, t, { status: "resuelto", resolution: resolution, resolvedAt: Date.now() }) : t; });
        await saveKey("tickets", state.tickets);
        if (ticket) logActivity('Reporte ' + (ticket.folio || "") + ' resuelto: "' + ticket.device + '"');
        renderTabContent();
      });
    });
    document.querySelectorAll("[data-reopen-ticket]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.dataset.reopenTicket;
        var ticket = state.tickets.find(function(t){ return t.id === id; });
        state.tickets = state.tickets.map(function(t){ return t.id === id ? Object.assign({}, t, { status: "abierto" }) : t; });
        await saveKey("tickets", state.tickets);
        if (ticket) logActivity('Reporte ' + (ticket.folio || "") + " reabierto");
        renderTabContent();
      });
    });
    document.querySelectorAll("[data-add-note]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.dataset.addNote;
        var input = document.getElementById("note-" + id);
        var text = input ? input.value.trim() : "";
        if (!text) { flash("Escribe algo para la nota.", true); return; }
        var ticket = state.tickets.find(function(t){ return t.id === id; });
        var newNote = { ts: Date.now(), text: text };
        state.tickets = state.tickets.map(function(t){ return t.id === id ? Object.assign({}, t, { notes: (t.notes || []).concat([newNote]) }) : t; });
        await saveKey("tickets", state.tickets);
        if (ticket) logActivity('Nota agregada al reporte ' + (ticket.folio || ""));
        renderTabContent();
      });
    });
    document.querySelectorAll("[data-view-ticket-photo]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.dataset.viewTicketPhoto;
        var container = document.getElementById("ticket-photo-" + id);
        if (!container) return;
        if (container.style.display !== "none") { container.style.display = "none"; return; }
        if (!container.dataset.loaded) {
          container.textContent = "Cargando…";
          container.style.display = "block";
          var dataUrl = await loadKey("ticket-photo:" + id, null);
          container.textContent = "";
          if (dataUrl) {
            var img = document.createElement("img");
            img.src = dataUrl;
            img.style.maxWidth = "220px";
            img.style.borderRadius = "6px";
            img.style.border = "1px solid var(--paper-line)";
            img.style.display = "block";
            container.appendChild(img);
            container.dataset.loaded = "1";
          } else {
            container.textContent = "No se pudo cargar la foto.";
          }
        }
        container.style.display = "block";
      });
    });
    document.querySelectorAll("[data-derive-ticket]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.dataset.deriveTicket;
        var sel = document.getElementById("derive-" + id);
        var newAssignee = sel ? sel.value : "";
        var ticket = state.tickets.find(function(t){ return t.id === id; });
        state.tickets = state.tickets.map(function(t){ return t.id === id ? Object.assign({}, t, { assignedTo: newAssignee }) : t; });
        await saveKey("tickets", state.tickets);
        if (ticket) logActivity("Reporte " + (ticket.folio || "") + " derivado a " + (newAssignee ? memberName(newAssignee) : "sin asignar"));
        flash("Actualizado.");
        renderTabContent();
      });
    });
    document.querySelectorAll("[data-pdf-ticket]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.dataset.pdfTicket;
        var ticket = state.tickets.find(function(t){ return t.id === id; });
        if (ticket) generateServiceOrderPDF(ticket);
      });
    });
    document.querySelectorAll("[data-delete-ticket]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.dataset.deleteTicket;
        state.tickets = state.tickets.filter(function(t){ return t.id !== id; });
        await saveKey("tickets", state.tickets);
        renderTabContent();
      });
    });
    var exportTicketsBtn = document.getElementById("export-tickets-btn");
    if (exportTicketsBtn) exportTicketsBtn.addEventListener("click", function(){
      var rows = state.tickets.slice().sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
      var out = [["Folio","Fecha","Área","Equipo","Tipo de falla","Urgencia","Reportó","Descripción","Estado","Derivado a","Solución"]];
      rows.forEach(function(t){
        out.push([t.folio || "", formatDateMX((new Date(t.createdAt)).toISOString().slice(0,10)), t.area || "", t.device, t.failureType, t.urgency, t.reporterName, t.description, t.status === "resuelto" ? "Resuelto" : "Abierto", t.assignedTo ? memberName(t.assignedTo) : "", t.resolution || ""]);
      });
      downloadCSV("soporte-it.csv", out);
    });
  }

  function notaCalc(items, ivaRate, incluyeIva) {
    var lineCents = (items || []).map(function(it){
      return Math.round((Number(it.cantidad) || 0) * (Number(it.precioUnit) || 0) * 100);
    });
    var rate = (Number(ivaRate) || 0) / 100;
    var subC, ivaC, totC;
    if (incluyeIva) {
      totC = lineCents.reduce(function(s, c){ return s + c; }, 0);
      subC = rate > 0 ? Math.round(totC / (1 + rate)) : totC;
      ivaC = totC - subC;
    } else {
      subC = lineCents.reduce(function(s, c){ return s + c; }, 0);
      ivaC = Math.round(subC * rate);
      totC = subC + ivaC;
    }
    return {
      lines: lineCents.map(function(c){ return c / 100; }),
      subtotal: subC / 100, iva: ivaC / 100, total: totC / 100
    };
  }

  function defaultNotaDraft() {
    var rate = (state.settings && state.settings.ivaRate != null) ? state.settings.ivaRate : 16;
    return {
      cliente: "", contacto: "", area: "", ticketFolio: "", fecha: todayISO(),
      items: [{ descripcion: "", cantidad: 1, precioUnit: 0 }],
      ivaRate: rate, preciosIncluyenIva: false, trabajo: ""
    };
  }

  function syncNotaDraftFromDOM() {
    var d = state.notaDraft;
    if (!d) return;
    var g = function(id){ var el = document.getElementById(id); return el ? el.value : ""; };
    d.cliente = g("nota-cliente");
    d.contacto = g("nota-contacto");
    d.area = g("nota-area");
    d.ticketFolio = g("nota-ticket");
    d.fecha = g("nota-fecha") || todayISO();
    d.trabajo = g("nota-trabajo");
    d.ivaRate = Number(g("nota-iva")) || 0;
    var chk = document.getElementById("nota-incluye-iva");
    d.preciosIncluyenIva = chk ? chk.checked : false;
    var rows = document.querySelectorAll("[data-nota-row]");
    d.items = [].map.call(rows, function(row){
      return {
        descripcion: row.querySelector('[data-f="desc"]').value,
        cantidad: Number(row.querySelector('[data-f="qty"]').value) || 0,
        precioUnit: Number(row.querySelector('[data-f="unit"]').value) || 0
      };
    });
  }

  function refreshNotaTotals() {
    syncNotaDraftFromDOM();
    var d = state.notaDraft;
    var calc = notaCalc(d.items, d.ivaRate, d.preciosIncluyenIva);
    var rows = document.querySelectorAll("[data-nota-row]");
    calc.lines.forEach(function(v, i){
      var cell = rows[i] && rows[i].querySelector('[data-f="importe"]');
      if (cell) cell.textContent = currency(v);
    });
    var set = function(id, v){ var el = document.getElementById(id); if (el) el.textContent = currency(v); };

    document.querySelectorAll('[data-nota-row] input, #nota-iva, #nota-incluye-iva').forEach(function(el){
      el.addEventListener(el.type === "checkbox" ? "change" : "input", refreshNotaTotals);
    });

  async function saveNota() {
    syncNotaDraftFromDOM();
    var d = state.notaDraft;
    if (!d.cliente.trim()) { flash("Falta el cliente.", true); return; }
    var items = d.items.filter(function(it){ return it.descripcion.trim() || it.precioUnit; });
    if (items.length === 0) { flash("Agrega al menos un concepto.", true); return; }
    var calc = notaCalc(items, d.ivaRate, d.preciosIncluyenIva);
    var payload = {
      cliente: d.cliente.trim(), contacto: d.contacto.trim(), area: d.area.trim(),
      ticketFolio: d.ticketFolio.trim(), fecha: d.fecha || todayISO(),
      items: items, ivaRate: Number(d.ivaRate) || 0, preciosIncluyenIva: d.preciosIncluyenIva,
      subtotal: calc.subtotal, iva: calc.iva, total: calc.total, trabajo: d.trabajo.trim()
    };
    var btn = document.getElementById("nota-save");
    if (btn) { btn.disabled = true; btn.textContent = "Guardando…"; }
    try {
      var res = await fetch("/betoalex/api/notas", {
        method: "POST", credentials: "same-origin",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.status === 401) { handleSessionExpired(); return; }
      var data = await res.json().catch(function(){ return {}; });
      if (!res.ok || !data.ok) { flash(data.error || "No se pudo guardar la nota.", true); return; }
      state.notas = [data.nota].concat(state.notas);
      state.notaDraft = defaultNotaDraft();
      flash("Nota " + data.nota.folio + " guardada.");
      logActivity("Nota de servicio " + data.nota.folio + " emitida para " + data.nota.cliente + " (" + currency(data.nota.total) + ")");
      renderTabContent();
      generateNotaPDF(data.nota);
    } catch (e) {
      flash("No se pudo conectar.", true);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = "Guardar y descargar PDF"; }
    }
  }

  async function deleteNota(id) {
    var removed = state.notas.find(function(n){ return n.id === id; });
    state.notas = state.notas.filter(function(n){ return n.id !== id; });
    await saveKey("notas", state.notas);
    if (removed) logActivity("Nota de servicio " + (removed.folio || "") + " eliminada");
    renderTabContent();
  }

  function generateNotaPDF(n) {
    if (!window.jspdf || !window.jspdf.jsPDF) { flash("No se pudo cargar el generador de PDF. Revisa tu conexión e intenta de nuevo.", true); return; }
    var doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter" });
    var pageWidth = doc.internal.pageSize.getWidth();
    var margin = 18;
    var y = 18;

    try { doc.addImage("data:image/jpeg;base64," + LOGO_GALEX_B64, "JPEG", margin, y - 4, 22, 22); } catch (e) {}
    var textX = margin + 28;
    doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.setTextColor(31, 42, 60);
    doc.text(GALEX_INFO.nombre, textX, y + 3);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(107, 71, 224);
    doc.text(String(GALEX_INFO.lema).toUpperCase(), textX, y + 8.5);
    doc.setTextColor(107, 117, 102);
    doc.text(GALEX_INFO.linea1, textX, y + 13);
    doc.text(GALEX_INFO.linea2, textX, y + 17.5);

    doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(31, 42, 60);
    doc.text("Nota de Servicio", pageWidth - margin, y + 2, { align: "right" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    doc.text("Folio: " + (n.folio || "—"), pageWidth - margin, y + 8, { align: "right" });
    doc.text("Fecha: " + formatDateMX(n.fecha || (new Date(n.createdAt)).toISOString().slice(0, 10)), pageWidth - margin, y + 13, { align: "right" });
    if (n.ticketFolio) doc.text("Reporte: " + n.ticketFolio, pageWidth - margin, y + 18, { align: "right" });

    y += 30;
    doc.setDrawColor(198, 208, 180);
    doc.line(margin, y, pageWidth - margin, y);
    y += 9;

    function field(label, value) {
      doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(69, 82, 107);
      doc.text(label, margin, y);
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(31, 42, 60);
      var lines = doc.splitTextToSize(String(value || "—"), pageWidth - margin * 2);
      doc.text(lines, margin, y + 5);
      y += 5 + (lines.length * 5) + 4;
    }
    field("Cliente:", n.cliente);
    if (n.contacto) field("Contacto:", n.contacto);
    if (n.area) field("Área / ubicación:", n.area);

    y += 2;
    var descX = margin + 16;
    var unitX = pageWidth - margin - 58;
    doc.setFillColor(236, 239, 225);
    doc.rect(margin, y - 4, pageWidth - margin * 2, 7, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(31, 42, 60);
    doc.text("CANT.", margin + 1, y);
    doc.text("CONCEPTO", descX, y);
    doc.text("P. UNITARIO", unitX + 18, y, { align: "right" });
    doc.text("IMPORTE", pageWidth - margin, y, { align: "right" });
    y += 6;
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(31, 42, 60);
    var calc = notaCalc(n.items || [], n.ivaRate, n.preciosIncluyenIva);
    (n.items || []).forEach(function(it, i){
      var descLines = doc.splitTextToSize(String(it.descripcion || "—"), unitX - descX - 4);
      doc.text(String(it.cantidad || 0), margin + 1, y);
      doc.text(descLines, descX, y);
      doc.text(currency(it.precioUnit || 0), unitX + 18, y, { align: "right" });
      doc.text(currency(calc.lines[i] || 0), pageWidth - margin, y, { align: "right" });
      y += Math.max(descLines.length, 1) * 4.6 + 3;
      doc.setDrawColor(220, 226, 208);
      doc.line(margin, y - 2, pageWidth - margin, y - 2);
    });

    y += 5;
    var boxX = pageWidth - margin - 60;
    function totalRow(label, value, bold) {
      doc.setFont("helvetica", bold ? "bold" : "normal");
      doc.setFontSize(bold ? 11 : 9.5);
      doc.setTextColor(69, 82, 107);
      doc.text(label, boxX, y);
      doc.setTextColor(31, 42, 60);
      doc.text(currency(value), pageWidth - margin, y, { align: "right" });
      y += bold ? 7 : 5.5;
    }
    totalRow("Subtotal", calc.subtotal, false);
    totalRow("IVA (" + (Number(n.ivaRate) || 0) + "%)", calc.iva, false);
    doc.setDrawColor(31, 42, 60);
    doc.line(boxX, y - 1, pageWidth - margin, y - 1);
    y += 3;
    totalRow("Total", calc.total, true);

    if (n.trabajo) { y += 6; field("Trabajo realizado / observaciones:", n.trabajo); }

    y += 16;
    doc.setDrawColor(140, 150, 130);
    doc.line(margin, y, margin + 70, y);
    doc.line(pageWidth - margin - 70, y, pageWidth - margin, y);
    y += 5;
    doc.setFontSize(9); doc.setTextColor(107, 117, 102);
    doc.text("Firma de conformidad — cliente", margin, y);
    doc.text("Por GALEX DIGITAL", pageWidth - margin - 70, y);

    y += 14;
    doc.setFontSize(7.5); doc.setTextColor(140, 150, 130);
    doc.text("Este documento ampara los trabajos realizados por GALEX DIGITAL y no tiene efectos fiscales. La factura se emite por separado.", margin, y, { maxWidth: pageWidth - margin * 2 });

    doc.save((n.folio || "nota-de-servicio") + ".pdf");
  }
