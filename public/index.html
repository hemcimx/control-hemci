<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bitácora de negocio</title>
<style>
  :root {
    --ink: #1F2A3C;
    --ink-soft: #45526B;
    --paper: #ECEFE1;
    --paper-dark: #DEE4CC;
    --paper-line: #C6D0B4;
    --stamp-red: #9C3B2E;
    --stamp-amber: #B4791F;
    --stamp-green: #3F6B4A;
    --brass: #A9812E;
    --text-muted: #6B7566;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-mono: 'Courier New', Courier, monospace;
    --font-body: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); }
  body { font-family: var(--font-body); color: var(--ink); }
  .ledger-app { display: flex; min-height: 100vh; }
  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 100vh; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--paper-dark); border-top-color: var(--brass); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--ink); color: var(--paper); padding: 20px 0 20px 14px; display: flex; flex-direction: column; gap: 24px; }
  .brand { display: flex; gap: 10px; align-items: flex-start; padding-right: 14px; }
  .brand-mark { font-family: var(--font-display); font-size: 28px; color: var(--brass); line-height: 1; }
  .brand-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.65; }
  .brand-input { background: transparent; border: none; border-bottom: 1px dashed rgba(236,239,225,0.4); color: var(--paper); font-family: var(--font-display); font-size: 16px; padding: 2px 0; width: 100%; }
  .brand-input:focus { outline: none; border-bottom-color: var(--brass); }
  .tabs { display: flex; flex-direction: column; gap: 4px; }
  .tab { display: flex; align-items: center; gap: 10px; background: transparent; border: none; color: rgba(236,239,225,0.75); font-family: var(--font-body); font-size: 14px; text-align: left; padding: 10px 14px; border-radius: 8px 0 0 8px; cursor: pointer; margin-right: -1px; }
  .tab:hover { background: rgba(236,239,225,0.08); color: var(--paper); }
  .tab-active { background: var(--paper); color: var(--ink); font-weight: 600; }
  .content { flex: 1; padding: 22px 28px; overflow-x: auto; position: relative; background-image: repeating-linear-gradient(to bottom, transparent, transparent 27px, var(--paper-line) 28px); }
  .panel-title { font-family: var(--font-display); font-size: 24px; margin: 0 0 16px; letter-spacing: 0.01em; }
  .card-title { margin-top: 0; font-family: var(--font-display); font-size: 16px; }
  .card { background: rgba(255,255,255,0.55); border: 1px solid var(--paper-line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 16px; align-items: end; }
  .form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-soft); }
  .form-grid .span-2 { grid-column: span 2; }
  input, select { font-family: var(--font-body); font-size: 14px; padding: 7px 9px; border: 1px solid var(--paper-line); border-radius: 6px; background: #fff; color: var(--ink); width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
  .btn-primary, .btn-secondary { display: inline-flex; align-items: center; gap: 6px; justify-content: center; font-family: var(--font-body); font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 6px; cursor: pointer; border: none; }
  .btn-primary { background: var(--ink); color: var(--paper); grid-column: span 2; }
  .btn-primary:hover { background: var(--ink-soft); }
  .btn-secondary { background: transparent; border: 1px solid var(--ink); color: var(--ink); margin-top: 8px; }
  .btn-secondary:hover { background: var(--paper-dark); }
  .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 12px; flex-wrap: wrap; }
  .total-chip { font-family: var(--font-mono); font-weight: 700; background: var(--paper-dark); padding: 6px 10px; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 1px solid var(--paper-line); padding: 6px 8px; }
  td { padding: 8px; border-bottom: 1px solid var(--paper-line); }
  .mono { font-family: var(--font-mono); }
  .amount { color: var(--brass); font-weight: 700; }
  .empty { color: var(--text-muted); font-style: italic; padding: 10px 0; margin: 0; }
  .icon-btn { background: transparent; border: none; cursor: pointer; color: var(--text-muted); padding: 4px 8px; border-radius: 4px; font-size: 14px; }
  .icon-btn:hover { background: var(--paper-dark); color: var(--stamp-red); }
  .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .stamp { display: inline-block; font-family: var(--font-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; border-radius: 4px; padding: 2px 6px; transform: rotate(-3deg); opacity: 0.85; mix-blend-mode: multiply; border-width: 2px; border-style: solid; }
  .stamp-pendiente { color: var(--stamp-red); border-color: var(--stamp-red); }
  .stamp-en_proceso { color: var(--stamp-amber); border-color: var(--stamp-amber); }
  .stamp-hecho { color: var(--stamp-green); border-color: var(--stamp-green); }
  .stamp-cancelada { color: var(--text-muted); border-color: var(--text-muted); }
  .priority { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; }
  .priority-alta { color: var(--stamp-red); }
  .priority-media { color: var(--brass); }
  .priority-baja { color: var(--stamp-green); }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 12px; color: var(--ink-soft); }
  .check-row input { width: auto; }
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .board-col { background: rgba(255,255,255,0.4); border: 1px solid var(--paper-line); border-radius: 10px; padding: 10px; min-height: 100px; }
  .board-col-head { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin-bottom: 10px; display: flex; justify-content: space-between; }
  .count { font-family: var(--font-mono); background: var(--paper-dark); padding: 1px 6px; border-radius: 10px; }
  .board-col-body { display: flex; flex-direction: column; gap: 10px; }
  .task-card { background: #fff; border: 1px solid var(--paper-line); border-radius: 8px; padding: 10px 12px; }
  .task-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .task-card h4 { margin: 0 0 4px; font-family: var(--font-display); font-size: 15px; }
  .task-project { font-size: 11px; color: var(--brass); font-weight: 600; margin-bottom: 4px; }
  .task-desc { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; }
  .task-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .overdue { color: var(--stamp-red); font-weight: 700; }
  .progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .progress-row input[type=range] { flex: 1; accent-color: var(--brass); width: auto; }
  .task-actions { display: flex; justify-content: space-between; align-items: center; }
  .link-btn { background: none; border: none; color: var(--ink-soft); font-size: 11px; text-decoration: underline; cursor: pointer; padding: 0; }
  .toast { position: absolute; top: 14px; right: 28px; background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; z-index: 10; }
  .toast-error { background: var(--stamp-red); }
  .member-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .hint { font-size: 12px; color: var(--text-muted); margin: 0 0 12px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stat-card { background: rgba(255,255,255,0.55); border: 1px solid var(--paper-line); border-radius: 10px; padding: 14px 16px; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
  .stat-value { font-family: var(--font-mono); font-size: 26px; font-weight: 700; margin-top: 4px; }
  .cat-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
  .cat-bar-track { flex: 1; height: 8px; background: var(--paper-dark); border-radius: 4px; overflow: hidden; }
  .cat-bar-fill { height: 100%; background: var(--brass); }
  .cat-bar-label { width: 130px; flex-shrink: 0; }
  .cat-bar-value { width: 80px; text-align: right; }
  .feed-item { font-size: 13px; padding: 8px 0; border-bottom: 1px dashed var(--paper-line); }
  .feed-item:last-child { border-bottom: none; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .confirm-panel { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; vertical-align: middle; flex-wrap: wrap; }
  .confirm-panel select { width: auto; }
  .confirm-error { color: var(--stamp-red); font-size: 11px; }
  .member-pin-row { display: flex; align-items: center; gap: 8px; margin: 2px 0 14px; flex-wrap: wrap; }
  @media (max-width: 760px) {
    .ledger-app { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 12px 14px; gap: 14px; overflow-x: auto; }
    .brand { padding-right: 0; }
    .tabs { flex-direction: row; }
    .tab { border-radius: 8px; margin-right: 0; white-space: nowrap; }
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .span-2 { grid-column: span 1; }
    .btn-primary { grid-column: span 1; }
    .board { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
  var CATEGORIES = ["Insumos", "Servicios y suscripciones", "Renta", "Nómina", "Marketing", "Transporte", "Equipo y herramientas", "Impuestos", "Otro"];
  var PRIORITIES = [{id:"alta",label:"Alta"},{id:"media",label:"Media"},{id:"baja",label:"Baja"}];
  var PRIORITY_ORDER = { alta: 0, media: 1, baja: 2 };
  var STATUS_META = {
    pendiente: { label: "Pendiente" },
    en_proceso: { label: "En proceso" },
    hecho: { label: "Hecho" },
    cancelada: { label: "Cancelada" }
  };

  var state = {
    tab: "resumen",
    team: [],
    expenses: [],
    tasks: [],
    contributions: [],
    settings: { companyName: "Nuestro Negocio" },
    loading: true,
    notice: null,
    gastosMonthFilter: new Date().toISOString().slice(0,7),
    tareasShowCancelled: false
  };
  if (window.matchMedia && window.matchMedia("(max-width: 760px)").matches) {
    state.tab = "mis-pendientes";
  }

  function uid() {
    return (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));
  }
  function currency(n) {
    return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" }).format(n || 0);
  }
  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function memberName(id) {
    var m = state.team.find(function(x){ return x.id === id; });
    return m ? m.name : "Sin asignar";
  }

  async function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    var buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
  }

  function getMyIdentity() {
    try { return localStorage.getItem("hemci-my-id") || null; } catch (e) { return null; }
  }
  function setMyIdentity(id) {
    try { localStorage.setItem("hemci-my-id", id); } catch (e) {}
  }
  function clearMyIdentity() {
    try { localStorage.removeItem("hemci-my-id"); } catch (e) {}
  }

  function isFullyConfirmed(entry) {
    var confirmedBy = entry.confirmedBy || [];
    return state.team.length > 0 && state.team.every(function(m){ return confirmedBy.indexOf(m.id) !== -1; });
  }
  function confirmStampHTML(entry) {
    var confirmedBy = entry.confirmedBy || [];
    if (isFullyConfirmed(entry)) return '<span class="stamp stamp-hecho">Confirmada</span>';
    if (confirmedBy.length === 0) return '<span class="stamp stamp-pendiente">Pendiente</span>';
    var missing = state.team.filter(function(m){ return confirmedBy.indexOf(m.id) === -1; }).map(function(m){ return m.name; }).join(", ");
    return '<span class="stamp stamp-en_proceso">Falta: ' + escapeHtml(missing) + '</span>';
  }
  function confirmControlHTML(entry, kind) {
    var confirmedBy = entry.confirmedBy || [];
    var pending = state.team.filter(function(m){ return confirmedBy.indexOf(m.id) === -1; });
    if (pending.length === 0) return "";
    var rowId = kind + "-" + entry.id;
    var options = pending.map(function(m){ return '<option value="' + m.id + '">' + escapeHtml(m.name) + '</option>'; }).join("");
    return (
      '<button type="button" class="link-btn" data-toggle-confirm="' + rowId + '">Confirmar</button>' +
      '<div class="confirm-panel" id="confirm-panel-' + rowId + '" style="display:none">' +
        '<select id="confirm-member-' + rowId + '">' + options + '</select>' +
        '<input type="password" inputmode="numeric" maxlength="4" placeholder="Clave" id="confirm-pin-' + rowId + '" style="max-width:90px;" />' +
        '<button type="button" class="btn-secondary" data-confirm-submit="' + rowId + '" data-confirm-id="' + entry.id + '" data-confirm-kind="' + kind + '">OK</button>' +
        '<span class="confirm-error" id="confirm-error-' + rowId + '"></span>' +
      '</div>'
    );
  }
  async function confirmEntry(kind, id, memberId, pin) {
    var member = state.team.find(function(m){ return m.id === memberId; });
    if (!member) return { ok: false, error: "Integrante no encontrado." };
    if (!member.pinHash) return { ok: false, error: "Sin clave configurada (ve a Equipo)." };
    var hash = await sha256Hex(pin);
    if (hash !== member.pinHash) return { ok: false, error: "Clave incorrecta." };
    var list = kind === "expenses" ? state.expenses : state.contributions;
    var next = list.map(function(item){
      if (item.id !== id) return item;
      var confirmedBy = item.confirmedBy || [];
      if (confirmedBy.indexOf(memberId) === -1) confirmedBy = confirmedBy.concat([memberId]);
      return Object.assign({}, item, { confirmedBy: confirmedBy });
    });
    if (kind === "expenses") { state.expenses = next; await saveKey("expenses", next); }
    else { state.contributions = next; await saveKey("contributions", next); }
    flash("Confirmado.");
    renderTabContent();
    return { ok: true };
  }
  function bindConfirmEvents() {
    document.querySelectorAll("[data-toggle-confirm]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var panel = document.getElementById("confirm-panel-" + btn.dataset.toggleConfirm);
        if (panel) panel.style.display = (panel.style.display === "none") ? "flex" : "none";
      });
    });
    document.querySelectorAll("[data-confirm-submit]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var rowId = btn.dataset.confirmSubmit;
        var entryId = btn.dataset.confirmId;
        var kind = btn.dataset.confirmKind;
        var memberSel = document.getElementById("confirm-member-" + rowId);
        var pinInput = document.getElementById("confirm-pin-" + rowId);
        var errorSlot = document.getElementById("confirm-error-" + rowId);
        var pin = pinInput.value.trim();
        errorSlot.textContent = "";
        if (!/^\d{4}$/.test(pin)) { errorSlot.textContent = "Clave de 4 dígitos."; return; }
        var result = await confirmEntry(kind, entryId, memberSel.value, pin);
        if (!result.ok) errorSlot.textContent = result.error;
      });
    });
  }

  var API_BASE = "/betoalex/api/data/";

  async function loadKey(key, fallback) {
    try {
      var res = await fetch(API_BASE + key);
      if (!res.ok) return fallback;
      var val = await res.json();
      return (val === null || val === undefined) ? fallback : val;
    } catch (e) { return fallback; }
  }
  async function saveKey(key, value) {
    try {
      var res = await fetch(API_BASE + key, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(value)
      });
      return res.ok;
    } catch (e) { return false; }
  }

  async function init() {
    var results = await Promise.all([
      loadKey("team", null),
      loadKey("expenses", []),
      loadKey("tasks", []),
      loadKey("settings", { companyName: "Nuestro Negocio" }),
      loadKey("contributions", [])
    ]);
    var team = results[0], expenses = results[1], tasks = results[2], settings = results[3], contributions = results[4];
    if (!team || team.length === 0) {
      team = [{ id: uid(), name: "Socio 1" }, { id: uid(), name: "Socio 2" }];
      await saveKey("team", team);
    }
    state.team = team;
    state.expenses = expenses;
    state.tasks = tasks;
    state.contributions = contributions;
    state.settings = settings;
    state.loading = false;
    render();
  }

  function flash(msg, isError) {
    state.notice = { msg: msg, isError: isError };
    renderNotice();
    setTimeout(function(){ state.notice = null; renderNotice(); }, 3000);
  }

  async function addExpense(exp) {
    var item = Object.assign({}, exp, { id: uid(), createdAt: Date.now(), confirmedBy: [] });
    state.expenses = [item].concat(state.expenses);
    var ok = await saveKey("expenses", state.expenses);
    flash(ok ? "Gasto registrado." : "No se pudo guardar el gasto.", !ok);
    renderTabContent();
  }
  async function deleteExpense(id) {
    state.expenses = state.expenses.filter(function(x){ return x.id !== id; });
    await saveKey("expenses", state.expenses);
    renderTabContent();
  }
  async function addTask(task) {
    var item = Object.assign({}, task, { id: uid(), createdAt: Date.now(), updatedAt: Date.now() });
    state.tasks = [item].concat(state.tasks);
    var ok = await saveKey("tasks", state.tasks);
    flash(ok ? "Tarea creada." : "No se pudo guardar la tarea.", !ok);
    renderTabContent();
  }
  async function updateTask(id, patch) {
    state.tasks = state.tasks.map(function(t){ return t.id === id ? Object.assign({}, t, patch, { updatedAt: Date.now() }) : t; });
    await saveKey("tasks", state.tasks);
    renderTabContent();
  }
  async function deleteTask(id) {
    state.tasks = state.tasks.filter(function(t){ return t.id !== id; });
    await saveKey("tasks", state.tasks);
    renderTabContent();
  }
  async function addContribution(c) {
    var item = Object.assign({}, c, { id: uid(), createdAt: Date.now(), confirmedBy: [] });
    state.contributions = [item].concat(state.contributions);
    var ok = await saveKey("contributions", state.contributions);
    flash(ok ? "Aportación registrada." : "No se pudo guardar la aportación.", !ok);
    renderTabContent();
  }
  async function deleteContribution(id) {
    state.contributions = state.contributions.filter(function(x){ return x.id !== id; });
    await saveKey("contributions", state.contributions);
    renderTabContent();
  }
  async function saveTeam(next) {
    state.team = next;
    var ok = await saveKey("team", next);
    if (!ok) flash("No se pudo guardar el equipo.", true);
    renderTabContent();
  }
  async function saveSettings(next) {
    state.settings = next;
    await saveKey("settings", next);
  }

  function render() {
    var app = document.getElementById("app");
    if (state.loading) {
      app.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><p>Abriendo la bitácora…</p></div>';
      return;
    }
    app.innerHTML =
      '<div class="ledger-app">' +
        '<aside class="sidebar">' +
          '<div class="brand">' +
            '<span class="brand-mark">§</span>' +
            '<div>' +
              '<div class="brand-label">Bitácora de</div>' +
              '<input class="brand-input" id="company-name-input" value="' + escapeHtml(state.settings.companyName) + '" />' +
            '</div>' +
          '</div>' +
          '<nav class="tabs">' +
            tabButton("resumen", "Resumen") +
            tabButton("mis-pendientes", "Mis pendientes") +
            tabButton("gastos", "Gastos") +
            tabButton("aportaciones", "Aportaciones") +
            tabButton("tareas", "Tareas") +
            tabButton("equipo", "Equipo") +
          '</nav>' +
        '</aside>' +
        '<main class="content">' +
          '<div id="notice-slot"></div>' +
          '<div id="tab-content"></div>' +
        '</main>' +
      '</div>';
    bindShellEvents();
    renderTabContent();
    renderNotice();
  }

  function tabButton(id, label) {
    var active = state.tab === id ? " tab-active" : "";
    return '<button class="tab' + active + '" data-tab="' + id + '">' + label + '</button>';
  }

  function bindShellEvents() {
    document.querySelectorAll(".tab").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.tab = btn.dataset.tab;
        document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("tab-active", b.dataset.tab === state.tab); });
        renderTabContent();
      });
    });
    var companyInput = document.getElementById("company-name-input");
    companyInput.addEventListener("blur", function(){
      var val = companyInput.value.trim() || "Nuestro Negocio";
      if (val !== state.settings.companyName) saveSettings(Object.assign({}, state.settings, { companyName: val }));
    });
  }

  function renderNotice() {
    var slot = document.getElementById("notice-slot");
    if (!slot) return;
    if (!state.notice) { slot.innerHTML = ""; return; }
    slot.innerHTML = '<div class="toast ' + (state.notice.isError ? "toast-error" : "") + '">' +
      (state.notice.isError ? "⚠" : "✓") + " " + escapeHtml(state.notice.msg) + '</div>';
  }

  function renderTabContent() {
    var el = document.getElementById("tab-content");
    el.innerHTML = tabContentHTML();
    bindTabEvents();
  }
  function tabContentHTML() {
    if (state.tab === "resumen") return resumenHTML();
    if (state.tab === "mis-pendientes") return misPendientesHTML();
    if (state.tab === "gastos") return gastosHTML();
    if (state.tab === "aportaciones") return aportacionesHTML();
    if (state.tab === "tareas") return tareasHTML();
    if (state.tab === "equipo") return equipoHTML();
    return "";
  }
  function bindTabEvents() {
    if (state.tab === "mis-pendientes") bindMisPendientesEvents();
    if (state.tab === "gastos") bindGastosEvents();
    if (state.tab === "aportaciones") bindAportacionesEvents();
    if (state.tab === "tareas") bindTareasEvents();
    if (state.tab === "equipo") bindEquipoEvents();
  }

  // ---------- Resumen ----------
  function resumenHTML() {
    var monthKey = todayISO().slice(0, 7);
    var confirmedExpenses = state.expenses.filter(isFullyConfirmed);
    var confirmedContributions = state.contributions.filter(isFullyConfirmed);
    var pendingExpenses = state.expenses.length - confirmedExpenses.length;
    var pendingContributions = state.contributions.length - confirmedContributions.length;
    var monthExpenses = confirmedExpenses.filter(function(e){ return e.date && e.date.slice(0,7) === monthKey; });
    var monthTotal = monthExpenses.reduce(function(s,e){ return s + Number(e.amount || 0); }, 0);
    var categoryTotals = {};
    monthExpenses.forEach(function(e){ categoryTotals[e.category] = (categoryTotals[e.category] || 0) + Number(e.amount || 0); });
    var topCategories = Object.entries(categoryTotals).sort(function(a,b){ return b[1]-a[1]; }).slice(0,5);
    var maxCat = topCategories.length ? topCategories[0][1] : 1;
    var active = state.tasks.filter(function(t){ return t.status !== "cancelada"; });
    var pendientes = state.tasks.filter(function(t){ return t.status === "pendiente"; }).length;
    var avgProgress = active.length ? Math.round(active.reduce(function(s,t){ return s + Number(t.progress || 0); }, 0) / active.length) : 0;
    var totalAportado = confirmedContributions.reduce(function(s,c){ return s + Number(c.amount || 0); }, 0);
    var totalGastadoTodo = confirmedExpenses.reduce(function(s,e){ return s + Number(e.amount || 0); }, 0);
    var disponible = totalAportado - totalGastadoTodo;
    var upcoming = state.tasks.filter(function(t){ return t.dueDate && t.status !== "hecho" && t.status !== "cancelada"; })
      .sort(function(a,b){ return a.dueDate.localeCompare(b.dueDate); }).slice(0,5);
    var feed = state.expenses.map(function(e){ return { ts: e.createdAt || 0, text: "Gasto de " + currency(e.amount) + " en " + escapeHtml(e.category) }; })
      .concat(state.tasks.map(function(t){ return { ts: t.updatedAt || t.createdAt || 0, text: escapeHtml(t.title) + " — " + (STATUS_META[t.status] ? STATUS_META[t.status].label : "") + " (" + (t.progress||0) + "%)" }; }))
      .sort(function(a,b){ return b.ts - a.ts; }).slice(0,6);

    return (
      '<h2 class="panel-title">Resumen</h2>' +
      (pendingExpenses + pendingContributions > 0 ?
        '<p class="hint">⚠ ' + (pendingExpenses + pendingContributions) + ' movimiento(s) esperando confirmación de clave — no cuentan todavía en los totales de abajo.</p>' : '') +
      '<div class="stat-grid">' +
        '<div class="stat-card"><div class="stat-label">Gastado este mes</div><div class="stat-value">' + currency(monthTotal) + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">Tareas pendientes</div><div class="stat-value">' + pendientes + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">Avance general</div><div class="stat-value">' + avgProgress + '%</div></div>' +
        '<div class="stat-card"><div class="stat-label">Capital disponible</div><div class="stat-value">' + currency(disponible) + '</div></div>' +
      '</div>' +
      '<div class="two-col">' +
        '<div class="card"><h3 class="card-title">Gastos por categoría</h3>' +
          (topCategories.length === 0 ? '<p class="empty">Sin gastos este mes.</p>' :
            topCategories.map(function(entry){
              var cat = entry[0], val = entry[1];
              return '<div class="cat-bar-row"><span class="cat-bar-label">' + escapeHtml(cat) + '</span>' +
                '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:' + ((val/maxCat)*100) + '%"></div></div>' +
                '<span class="cat-bar-value mono">' + currency(val) + '</span></div>';
            }).join("")) +
        '</div>' +
        '<div class="card"><h3 class="card-title">Próximas fechas límite</h3>' +
          (upcoming.length === 0 ? '<p class="empty">No hay fechas próximas.</p>' :
            upcoming.map(function(t){
              return '<div class="feed-item"><strong>' + escapeHtml(t.title) + '</strong> — ' + escapeHtml(memberName(t.assignee)) +
                '<span class="mono" style="float:right">' + t.dueDate + '</span></div>';
            }).join("")) +
        '</div>' +
      '</div>' +
      '<div class="card"><h3 class="card-title">Actividad reciente</h3>' +
        (feed.length === 0 ? '<p class="empty">Todavía no hay movimientos.</p>' : feed.map(function(f){ return '<div class="feed-item">' + f.text + '</div>'; }).join("")) +
      '</div>'
    );
  }

  // ---------- Mis pendientes ----------
  function misPendientesHTML() {
    var myId = getMyIdentity();
    var me = myId ? state.team.find(function(m){ return m.id === myId; }) : null;
    if (!me) {
      var buttons = state.team.map(function(m){
        return '<button type="button" class="btn-secondary" data-pick-identity="' + m.id + '">' + escapeHtml(m.name) + '</button>';
      }).join(" ");
      return (
        '<h2 class="panel-title">Mis pendientes</h2>' +
        '<div class="card">' +
          '<p class="hint">¿Quién eres? Elige tu nombre para ver solo tus pendientes, sin distracciones de las del otro.</p>' +
          '<div style="display:flex; gap:10px; flex-wrap:wrap;">' + buttons + '</div>' +
        '</div>'
      );
    }
    var myTasks = state.tasks.filter(function(t){ return t.assignee === myId && (t.status === "pendiente" || t.status === "en_proceso"); });
    myTasks.sort(function(a, b){
      var pa = PRIORITY_ORDER[a.priority] != null ? PRIORITY_ORDER[a.priority] : 3;
      var pb = PRIORITY_ORDER[b.priority] != null ? PRIORITY_ORDER[b.priority] : 3;
      if (pa !== pb) return pa - pb;
      if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
      if (a.dueDate) return -1;
      if (b.dueDate) return 1;
      return 0;
    });
    return (
      '<div class="list-header"><h2 class="panel-title" style="margin:0;">Pendientes de ' + escapeHtml(me.name) + '</h2>' +
      '<button type="button" class="link-btn" id="change-identity-btn">No soy yo, cambiar</button></div>' +
      (myTasks.length === 0 ? '<p class="empty">No tienes tareas pendientes.</p>' :
        '<div class="board-col-body">' + myTasks.map(taskCardHTML).join("") + '</div>')
    );
  }
  function bindMisPendientesEvents() {
    document.querySelectorAll("[data-pick-identity]").forEach(function(btn){
      btn.addEventListener("click", function(){
        setMyIdentity(btn.dataset.pickIdentity);
        renderTabContent();
      });
    });
    var changeBtn = document.getElementById("change-identity-btn");
    if (changeBtn) changeBtn.addEventListener("click", function(){
      clearMyIdentity();
      renderTabContent();
    });
  }

  // ---------- Gastos ----------

    var monthFilter = state.gastosMonthFilter;
    var filtered = state.expenses.filter(function(e){ return !monthFilter || (e.date && e.date.slice(0,7) === monthFilter); });

    return (
      '<h2 class="panel-title">Gastos</h2>' +
      '<form class="card form-grid" id="expense-form">' +
        '<label>Monto<input type="number" min="0" step="0.01" name="amount" placeholder="0.00" required /></label>' +
        '<label>Categoría<select name="category">' + categoryOptions + '</select></label>' +
        '<label>Pagó<select name="paidBy">' + teamOptions + '</select></label>' +
        '<label>Fecha<input type="date" name="date" value="' + todayISO() + '" /></label>' +
        '<label class="span-2">Descripción<input type="text" name="description" placeholder="Ej. Papelería para oficina" /></label>' +
        '<button type="submit" class="btn-primary">+ Registrar gasto</button>' +
      '</form>' +
      '<div class="list-header">' +
        '<input type="month" id="month-filter" value="' + monthFilter + '" />' +
        '<span class="total-chip">Total confirmado: ' + currency(total) + '</span>' +
        (pendingCount > 0 ? '<span class="hint" style="margin:0;">' + pendingCount + ' pendiente(s) de confirmar</span>' : '') +
      '</div>' +
      '<div class="card table-wrap">' +
        (sorted.length === 0 ? '<p class="empty">Aún no hay gastos registrados en este periodo.</p>' :
          '<table><thead><tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th>Pagó</th><th>Monto</th><th>Estado</th><th></th></tr></thead><tbody>' +
          sorted.map(function(e){
            return '<tr><td class="mono">' + e.date + '</td><td>' + escapeHtml(e.category) + '</td><td>' +
              (escapeHtml(e.description) || "—") + '</td><td>' + escapeHtml(memberName(e.paidBy)) + '</td>' +
              '<td class="mono amount">' + currency(e.amount) + '</td>' +

              '<td><button class="icon-btn" data-delete-expense="' + e.id + '" aria-label="Eliminar gasto">✕</button></td></tr>';
          }).join("") + '</tbody></table>') +

      e.preventDefault();
      var fd = new FormData(e.target);
      var amount = Number(fd.get("amount"));
      if (!amount || amount <= 0) return;
      addExpense({
        amount: amount,
        category: fd.get("category"),
        paidBy: fd.get("paidBy"),
        date: fd.get("date") || todayISO(),
        description: (fd.get("description") || "").trim()
      });
    });
    document.getElementById("month-filter").addEventListener("change", function(e){
      state.gastosMonthFilter = e.target.value;
      renderTabContent();
    });
    document.querySelectorAll("[data-delete-expense]").forEach(function(btn){
      btn.addEventListener("click", function(){ deleteExpense(btn.dataset.deleteExpense); });
    });
    bindConfirmEvents();

  // ---------- Tareas ----------
  function tareasHTML() {
    var showCancelled = state.tareasShowCancelled;
    var visible = state.tasks.filter(function(t){ return showCancelled || t.status !== "cancelada"; });
    var teamOptions = state.team.map(function(m){ return '<option value="' + m.id + '">' + escapeHtml(m.name) + '</option>'; }).join("");
    var priorityOptions = PRIORITIES.map(function(p){ return '<option value="' + p.id + '">' + p.label + '</option>'; }).join("");
    var columns = [{ id: "pendiente", label: "Pendientes" }, { id: "en_proceso", label: "En proceso" }, { id: "hecho", label: "Hechas" }];

    var boardCols = columns.map(function(col){
      return '<div class="board-col"><div class="board-col-head">' + col.label + ' <span class="count">' +
        visible.filter(function(t){ return t.status === col.id; }).length + '</span></div>' +
        '<div class="board-col-body">' + visible.filter(function(t){ return t.status === col.id; }).map(taskCardHTML).join("") + '</div></div>';
    }).join("");

    if (showCancelled) {
      var cancelled = visible.filter(function(t){ return t.status === "cancelada"; });
      boardCols += '<div class="board-col"><div class="board-col-head">Canceladas <span class="count">' + cancelled.length + '</span></div>' +
        '<div class="board-col-body">' + cancelled.map(taskCardHTML).join("") + '</div></div>';
    }

    return (
      '<h2 class="panel-title">Tareas y avances</h2>' +
      '<form class="card form-grid" id="task-form">' +
        '<label class="span-2">Tarea<input type="text" name="title" placeholder="Ej. Cotizar proveedor nuevo" required /></label>' +
        '<label>Proyecto (opcional)<input type="text" name="project" placeholder="Ej. Apertura sucursal" /></label>' +
        '<label>Asignar a<select name="assignee">' + teamOptions + '</select></label>' +
        '<label>Prioridad<select name="priority">' + priorityOptions + '</select></label>' +
        '<label>Fecha límite<input type="date" name="dueDate" /></label>' +
        '<label class="span-2">Notas<input type="text" name="description" placeholder="Detalles de la tarea" /></label>' +
        '<button type="submit" class="btn-primary">+ Crear tarea</button>' +
      '</form>' +
      '<label class="check-row"><input type="checkbox" id="show-cancelled" ' + (showCancelled ? "checked" : "") + ' /> Mostrar canceladas</label>' +
      '<div class="board">' + boardCols + '</div>'
    );
  }
  function taskCardHTML(t) {
    var overdue = t.dueDate && t.status !== "hecho" && t.status !== "cancelada" && t.dueDate < todayISO();
    var meta = STATUS_META[t.status] || STATUS_META.pendiente;
    var priorityObj = PRIORITIES.find(function(p){ return p.id === t.priority; });
    var priorityLabel = priorityObj ? priorityObj.label : "";
    return (
      '<div class="task-card">' +
        '<div class="task-card-top"><span class="stamp stamp-' + t.status + '">' + meta.label + '</span>' +
        '<span class="priority priority-' + t.priority + '">' + priorityLabel + '</span></div>' +
        '<h4>' + escapeHtml(t.title) + '</h4>' +
        (t.project ? '<div class="task-project">' + escapeHtml(t.project) + '</div>' : "") +
        (t.description ? '<p class="task-desc">' + escapeHtml(t.description) + '</p>' : "") +
        '<div class="task-meta"><span>' + escapeHtml(memberName(t.assignee)) + '</span>' +
        (t.dueDate ? '<span class="' + (overdue ? "overdue" : "") + '">' + t.dueDate + '</span>' : "") + '</div>' +
        (t.status !== "cancelada" ?
          '<div class="progress-row"><input type="range" min="0" max="100" step="5" value="' + (t.progress||0) + '" data-progress="' + t.id + '" />' +
          '<span class="mono" id="progress-label-' + t.id + '">' + (t.progress||0) + '%</span></div>' : "") +
        '<div class="task-actions">' +
        (t.status !== "cancelada" ?
          '<button class="link-btn" data-cancel-task="' + t.id + '">Cancelar</button>' :
          '<button class="link-btn" data-reactivate-task="' + t.id + '">Reactivar</button>') +
        '<button class="icon-btn" data-delete-task="' + t.id + '" aria-label="Eliminar tarea">✕</button></div>' +
      '</div>'
    );
  }
  function bindTareasEvents() {
    document.getElementById("task-form").addEventListener("submit", function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      var title = (fd.get("title") || "").trim();
      if (!title) return;
      addTask({
        title: title,
        project: (fd.get("project") || "").trim(),
        assignee: fd.get("assignee"),
        priority: fd.get("priority"),
        dueDate: fd.get("dueDate") || "",
        description: (fd.get("description") || "").trim(),
        status: "pendiente",
        progress: 0
      });
    });
    document.getElementById("show-cancelled").addEventListener("change", function(e){
      state.tareasShowCancelled = e.target.checked;
      renderTabContent();
    });
    document.querySelectorAll("[data-progress]").forEach(function(input){
      input.addEventListener("input", function(e){
        document.getElementById("progress-label-" + input.dataset.progress).textContent = e.target.value + "%";
      });
      input.addEventListener("change", function(e){
        var id = input.dataset.progress;
        var v = Number(e.target.value);
        var status = "en_proceso";
        if (v <= 0) status = "pendiente";
        if (v >= 100) status = "hecho";
        updateTask(id, { progress: v, status: status });
      });
    });
    document.querySelectorAll("[data-cancel-task]").forEach(function(btn){
      btn.addEventListener("click", function(){ updateTask(btn.dataset.cancelTask, { status: "cancelada" }); });
    });
    document.querySelectorAll("[data-reactivate-task]").forEach(function(btn){
      btn.addEventListener("click", function(){ updateTask(btn.dataset.reactivateTask, { status: "pendiente", progress: 0 }); });
    });
    document.querySelectorAll("[data-delete-task]").forEach(function(btn){
      btn.addEventListener("click", function(){ deleteTask(btn.dataset.deleteTask); });
    });
  }

        '<label>Fecha<input type="date" name="date" value="' + todayISO() + '" /></label>' +

        '<button type="submit" class="btn-primary">+ Registrar aportación</button>' +

          '<table><thead><tr><th>Fecha</th><th>Quién</th><th>Concepto</th><th>Monto</th><th>Estado</th><th></th></tr></thead><tbody>' +
          sorted.map(function(c){

  function bindAportacionesEvents() {

      });

    document.querySelectorAll("[data-delete-contribution]").forEach(function(btn){
      btn.addEventListener("click", function(){ deleteContribution(btn.dataset.deleteContribution); });
    });
    bindConfirmEvents();

  // ---------- Equipo ----------
  function equipoHTML() {
    var rows = state.team.map(function(m){
      var pinStatus = m.pinHash ? "Clave configurada ✓" : "Sin clave todavía";
      var currentPinField = m.pinHash ?
        '<input type="password" inputmode="numeric" maxlength="4" placeholder="Clave actual" id="pin-current-' + m.id + '" style="max-width:140px;" />' : "";
      return (
        '<div class="member-row"><input type="text" value="' + escapeHtml(m.name) + '" data-member-id="' + m.id + '" />' +
          '<button class="icon-btn" data-remove-member="' + m.id + '" ' + (state.team.length <= 1 ? "disabled" : "") + ' aria-label="Eliminar integrante">✕</button></div>' +
        '<div class="member-pin-row">' +
          '<span class="hint" style="margin:0;">' + pinStatus + '</span>' +
          currentPinField +
          '<input type="password" inputmode="numeric" maxlength="4" placeholder="' + (m.pinHash ? "Clave nueva" : "Nueva clave (4 dígitos)") + '" id="pin-input-' + m.id + '" style="max-width:170px;" />' +
          '<button type="button" class="btn-secondary" style="margin-top:0;" data-set-pin="' + m.id + '">Guardar clave</button>' +
        '</div>'
      );
    }).join("");
    return (
      '<h2 class="panel-title">Equipo</h2>' +
      '<div class="card">' +
        '<p class="hint">Estos nombres se usan para asignar tareas y para registrar quién paga cada gasto. Los datos se comparten entre quienes visiten esta página. Cada integrante puede poner su propia clave de 4 dígitos — se usa para confirmar gastos y aportaciones, como firma de autorización. Para cambiar una clave ya existente hace falta escribir la clave actual.</p>' +
        '<div id="member-rows">' + rows + '</div>' +
        '<button type="button" class="btn-secondary" id="add-member-btn">+ Agregar integrante</button>' +
      '</div>'
    );
  }
  function bindEquipoEvents() {
    document.querySelectorAll("[data-member-id]").forEach(function(input){
      input.addEventListener("blur", function(){
        var id = input.dataset.memberId;
        var name = input.value.trim() || "Sin nombre";
        var current = state.team.find(function(m){ return m.id === id; });
        if (current && current.name !== name) {
          saveTeam(state.team.map(function(m){ return m.id === id ? Object.assign({}, m, { name: name }) : m; }));
        }
      });
    });
    document.querySelectorAll("[data-remove-member]").forEach(function(btn){
      btn.addEventListener("click", function(){
        if (state.team.length <= 1) return;
        saveTeam(state.team.filter(function(m){ return m.id !== btn.dataset.removeMember; }));
      });
    });
    document.querySelectorAll("[data-set-pin]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.dataset.setPin;
        var member = state.team.find(function(m){ return m.id === id; });
        var newInput = document.getElementById("pin-input-" + id);
        var newPin = newInput.value.trim();
        if (!/^\d{4}$/.test(newPin)) { flash("La clave debe ser de exactamente 4 dígitos.", true); return; }
        if (member && member.pinHash) {
          var currentInput = document.getElementById("pin-current-" + id);
          var currentPin = currentInput ? currentInput.value.trim() : "";
          if (!/^\d{4}$/.test(currentPin)) { flash("Escribe tu clave actual para poder cambiarla.", true); return; }
          var currentHash = await sha256Hex(currentPin);
          if (currentHash !== member.pinHash) { flash("La clave actual no es correcta.", true); return; }
        }
        var newHash = await sha256Hex(newPin);
        var next = state.team.map(function(m){ return m.id === id ? Object.assign({}, m, { pinHash: newHash }) : m; });
        await saveTeam(next);
        flash("Clave guardada.");
      });
    });
    document.getElementById("add-member-btn").addEventListener("click", function(){
      saveTeam(state.team.concat([{ id: uid(), name: "Nuevo integrante" }]));
    });
  }

  document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
