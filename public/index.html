      } catch (e) {}
    })();
    var saveWaBtn = document.getElementById("save-support-whatsapp-btn");
    if (saveWaBtn) saveWaBtn.addEventListener("click", async function(){
      var number = document.getElementById("support-whatsapp-input").value.trim();
      try {
        var res = await fetch(AUTH_BASE + "support-whatsapp", {
          method: "POST", credentials: "same-origin",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ number: number })
        });
        var data = await res.json().catch(function(){ return {}; });
        if (res.ok && data.ok) {
          flash("Número de WhatsApp guardado.");
          logActivity((state.authName || "Alguien") + " actualizó el número de WhatsApp de soporte");
        } else if (res.status === 401 && data.error === "No autenticado.") {
          handleSessionExpired();
        } else {
          flash(data.error || "No se pudo guardar.", true);
        }
      } catch (e) { flash("No se pudo conectar.", true); }
    });
    (async function(){
      var userDisplay = document.getElementById("report-access-username-display");
      var pwDisplay = document.getElementById("report-access-password-display");
      var userInput = document.getElementById("report-access-username");
      try {
        var res = await fetch(AUTH_BASE + "report-access-status", { credentials: "same-origin" });
        var data = await res.json();
        if (userDisplay) userDisplay.textContent = data.username;
        if (pwDisplay) pwDisplay.textContent = data.currentPassword;
        if (userInput && !userInput.value) userInput.placeholder = data.username;
      } catch (e) {
        if (userDisplay) userDisplay.textContent = "—";
        if (pwDisplay) pwDisplay.textContent = "—";
      }
    })();
    var saveReportAccessBtn = document.getElementById("save-report-access-btn");
    if (saveReportAccessBtn) saveReportAccessBtn.addEventListener("click", async function(){
      var username = document.getElementById("report-access-username").value.trim();
      if (!username) { flash("Escribe un usuario.", true); return; }
      try {
        var res = await fetch(AUTH_BASE + "set-report-access", {
          method: "POST", credentials: "same-origin",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ username: username })
        });
        var data = await res.json().catch(function(){ return {}; });
        if (res.ok && data.ok) {
          flash("Usuario de reportes actualizado.");
          logActivity((state.authName || "Alguien") + " actualizó el usuario genérico de /reportar");
          renderTabContent();
        } else if (res.status === 401 && data.error === "No autenticado.") {
          handleSessionExpired();
        } else {
          flash(data.error || "No se pudo guardar.", true);
        }
      } catch (e) { flash("No se pudo conectar.", true); }
    });
    document.querySelectorAll("[data-member-id]").forEach(function(input){
      input.addEventListener("blur", function(){
        var id = input.dataset.memberId;
        var name = input.value.trim() || "Sin nombre";
        var current = state.team.find(function(m){ return m.id === id; });
        if (current && current.name !== name) {
          var oldName = current.name;
          saveTeam(state.team.map(function(m){ return m.id === id ? Object.assign({}, m, { name: name }) : m; }));
          logActivity('"' + oldName + '" cambió su nombre a "' + name + '"');
        }
      });
    });
    document.querySelectorAll("[data-remove-member]").forEach(function(btn){
      btn.addEventListener("click", function(){
        if (state.team.length <= 1) return;
        var removed = state.team.find(function(m){ return m.id === btn.dataset.removeMember; });
        saveTeam(state.team.filter(function(m){ return m.id !== btn.dataset.removeMember; }));
        if (removed) logActivity('Integrante eliminado: "' + removed.name + '"');
      });
    });
    document.querySelectorAll("[data-set-pin]").forEach(function(btn){
      btn.addEventListener("click", async function(){
        var id = btn.dataset.setPin;
        var member = state.team.find(function(m){ return m.id === id; });
        var newInput = document.getElementById("pin-input-" + id);
        var newPin = newInput.value.trim();
        if (!/^\d{4}$/.test(newPin)) { flash("La clave debe ser de exactamente 4 dígitos.", true); return; }
        if (member && member.pinHash) {
          var currentInput = document.getElementById("pin-current-" + id);
          var currentPin = currentInput ? currentInput.value.trim() : "";
          if (!/^\d{4}$/.test(currentPin)) { flash("Escribe tu clave actual para poder cambiarla.", true); return; }
          var currentHash = await sha256Hex(currentPin);
          if (currentHash !== member.pinHash) { flash("La clave actual no es correcta.", true); return; }
        }
        var newHash = await sha256Hex(newPin);
        var next = state.team.map(function(m){ return m.id === id ? Object.assign({}, m, { pinHash: newHash }) : m; });
        await saveTeam(next);
        flash("Clave guardada.");
        if (member) logActivity(member.name + (member.pinHash ? " cambió su clave" : " configuró su clave"));
      });
    });
    document.getElementById("add-member-btn").addEventListener("click", function(){
      saveTeam(state.team.concat([{ id: uid(), name: "Nuevo integrante" }]));
      logActivity("Integrante nuevo agregado");
    });
    var accessBtn = document.getElementById("save-access-btn");
    if (accessBtn) accessBtn.addEventListener("click", async function(){
      var current = document.getElementById("access-current").value;
      var newUsername = document.getElementById("access-new-username").value.trim();
      var newPassword = document.getElementById("access-new-password").value;
      if (!current) { flash("Escribe tu contraseña actual.", true); return; }
      if (newPassword && !isStrongPasswordClient(newPassword)) { flash("La nueva contraseña debe tener al menos 10 caracteres, con mayúscula, minúscula, número y símbolo.", true); return; }
      try {
        var res = await fetch(AUTH_BASE + "set-password", {
          method: "POST", credentials: "same-origin",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ currentPassword: current, username: newUsername, newPassword: newPassword })
        });
        var data = await res.json().catch(function(){ return {}; });
        if (res.ok && data.ok) {
          flash("Acceso actualizado.");
          logActivity((state.authName || "Alguien") + " actualizó su acceso (usuario/contraseña)");
          renderTabContent();
        } else if (res.status === 401 && data.error === "No autenticado.") {
          handleSessionExpired();
        } else {
          flash(data.error || "No se pudo actualizar.", true);
        }
      } catch (e) { flash("No se pudo conectar.", true); }
    });
  }

  // ---------- Página pública: /reportar ----------
  function isReportPath() {
    var parts = window.location.pathname.replace(/\/+$/, "").split("/");
    return parts[parts.length - 1] === "reportar";
  }
  async function initReportForm() {
    var app = document.getElementById("app");
    app.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><p>Cargando…</p></div>';
    var hasAccess = false;
    try {
      var chk = await fetch(PUBLIC_BASE + "report-check", { credentials: "same-origin" });
      var chkData = await chk.json();
      hasAccess = !!chkData.access;
    } catch (e) {}
    if (!hasAccess) { renderReportGate(); return; }
    var team = [];
    try {
      var res = await fetch(PUBLIC_BASE + "team-names");
      if (res.ok) team = await res.json();
    } catch (e) {}
    renderReportForm(team);
  }
  function renderReportGate(errorMsg) {
    var app = document.getElementById("app");
    app.innerHTML =
      '<div class="report-page"><div class="report-card">' +
        '<span class="brand-mark" style="font-size:32px;">§</span>' +
        '<h1 class="panel-title">Acceso a reportes</h1>' +
        '<p class="hint">Usa el usuario y contraseña que te compartieron.</p>' +
        (errorMsg ? '<div class="toast toast-error" style="position:static; display:flex; margin-bottom:14px;">' + escapeHtml(errorMsg) + '</div>' : '') +
        '<form id="report-gate-form">' +
          '<label>Usuario<input type="text" name="username" required autocomplete="username" /></label>' +
          '<label>Contraseña<input type="password" name="password" required autocomplete="current-password" /></label>' +
          '<button type="submit" class="btn-primary" style="width:100%;">Entrar</button>' +
        '</form>' +
      '</div></div>';
    document.getElementById("report-gate-form").addEventListener("submit", async function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      try {
        var res = await fetch(PUBLIC_BASE + "report-login", {
          method: "POST", credentials: "same-origin",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") })
        });
        var data = await res.json().catch(function(){ return {}; });
        if (res.ok && data.ok) { initReportForm(); }
        else { renderReportGate(data.error || "No se pudo entrar."); }
      } catch (err) { renderReportGate("No se pudo conectar. Revisa tu conexión."); }
    });
  }
  function renderReportForm(team, successMsg, whatsappUrl) {
    var app = document.getElementById("app");
    app.innerHTML =
      '<div class="report-page"><div class="report-card">' +
        '<span class="brand-mark" style="font-size:32px;">§</span>' +
        '<h1 class="panel-title">Reportar algo al equipo</h1>' +
        (successMsg ? '<div class="report-success">' + successMsg + '</div>' : '') +
        (whatsappUrl ? '<a href="' + whatsappUrl + '" target="_blank" rel="noopener" class="btn-primary" style="display:block; text-align:center; text-decoration:none; margin-bottom:16px;">Avisar por WhatsApp</a>' : '') +
        '<form id="report-form">' +
          '<label>Tipo de reporte' +
            '<select name="kind" id="report-kind">' +
              '<option value="tarea">Tarea general (ej. agendar visita o videollamada)</option>' +
              '<option value="falla">Falla técnica / soporte IT</option>' +
            '</select>' +
          '</label>' +
          '<label>Tu nombre<input type="text" name="reporterName" required placeholder="Ej. Karla, recepción" /></label>' +
          '<div id="report-fields-tarea">' +
            '<label>Título<input type="text" name="title" placeholder="Ej. Agendar videollamada con proveedor" /></label>' +
            '<label>Fecha (opcional)<input type="date" name="dueDate" /></label>' +
            '<label>Detalles<textarea name="taskDescription" rows="3" placeholder="Detalles de lo que se necesita"></textarea></label>' +
          '</div>' +
          '<div id="report-fields-falla" style="display:none">' +
            '<label>Área o departamento<input type="text" name="area" placeholder="Ej. Urgencias, Recepción, Quirófano" /></label>' +
            '<label>Equipo o dispositivo<input type="text" name="device" placeholder="Ej. Computadora de recepción" /></label>' +
            '<label>Tipo de falla<select name="failureType"><option>Hardware</option><option>Software</option><option>Red / Internet</option><option>Impresora</option><option>Otro</option></select></label>' +
            '<label>Urgencia<select name="urgency"><option>Baja</option><option selected>Media</option><option>Alta</option></select></label>' +
            '<label>Describe el problema<textarea name="failureDescription" rows="4" placeholder="¿Qué está pasando? ¿Desde cuándo?"></textarea></label>' +
            '<label>Foto del problema (opcional)<input type="file" accept="image/*" capture="environment" id="report-photo-input" /></label>' +
          '</div>' +
          '<button type="submit" class="btn-primary" style="width:100%;">Enviar reporte</button>' +
        '</form>' +
        '<p style="text-align:center; margin-top:16px;"><a href="#" id="goto-lookup" class="link-btn">¿Ya tienes un folio? Consulta su estado</a></p>' +
      '</div></div>';
    bindReportForm(team);
  }
  function bindReportForm(team) {
    var kindSelect = document.getElementById("report-kind");
    kindSelect.addEventListener("change", function(e){
      var isFalla = e.target.value === "falla";
      document.getElementById("report-fields-tarea").style.display = isFalla ? "none" : "block";
      document.getElementById("report-fields-falla").style.display = isFalla ? "block" : "none";
    });
    document.getElementById("goto-lookup").addEventListener("click", function(e){
      e.preventDefault();
      renderTicketLookup(team);
    });
    document.getElementById("report-form").addEventListener("submit", async function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      var kind = fd.get("kind");
      var reporterName = (fd.get("reporterName") || "").trim();
      if (!reporterName) return;
      var submitBtn = e.target.querySelector("button[type=submit]");
      if (kind === "tarea" && !(fd.get("title") || "").trim()) { alert("Escribe un título para la tarea."); return; }
      if (kind === "falla" && (!(fd.get("device") || "").trim() || !(fd.get("failureDescription") || "").trim())) { alert("Completa el equipo y la descripción del problema."); return; }
      submitBtn.disabled = true;
      submitBtn.textContent = "Enviando…";
      var photoDataUrl = null;
      var fileInput = document.getElementById("report-photo-input");
      if (kind === "falla" && fileInput && fileInput.files && fileInput.files[0]) {
        try { photoDataUrl = await readAndCompressImage(fileInput.files[0], 1200, 0.7); } catch (err) {}
      }
      var payload = {
        kind: kind, reporterName: reporterName,
        title: fd.get("title") || "", taskDescription: fd.get("taskDescription") || "",
        dueDate: fd.get("dueDate") || "",
        area: fd.get("area") || "", device: fd.get("device") || "", failureType: fd.get("failureType") || "",
        urgency: fd.get("urgency") || "", failureDescription: fd.get("failureDescription") || ""
      };
      var data = null;
      try {
        var res = await fetch(PUBLIC_BASE + "report", {
          method: "POST",
          credentials: "same-origin",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload)
        });
        data = await res.json().catch(function(){ return {}; });
        if (!res.ok) {
          alert(data.error || "No se pudo enviar el reporte, intenta de nuevo.");
          submitBtn.disabled = false; submitBtn.textContent = "Enviar reporte";
          return;
        }
      } catch (err) {
        alert("No se pudo enviar el reporte, revisa tu conexión.");
        submitBtn.disabled = false; submitBtn.textContent = "Enviar reporte";
        return;
      }
      if (photoDataUrl && data && data.id) {
        try {
          await fetch(PUBLIC_BASE + "ticket-photo", {
            method: "POST", credentials: "same-origin",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ ticketId: data.id, photo: photoDataUrl })
          });
        } catch (err) {}
      }
      var msg = (data && data.folio)
        ? ("¡Gracias! Tu reporte fue enviado.<br>Tu folio es <strong>" + escapeHtml(data.folio) + "</strong> — guárdalo para consultar el estado después.")
        : "¡Gracias! Tu reporte fue enviado.";
      var whatsappUrl = null;
      if (kind === "falla" && data && data.whatsapp) {
        var waText = "Nuevo reporte HEMCI\nFolio: " + (data.folio || "") +
          "\nEquipo: " + (payload.device || "") +
          (payload.area ? ("\nÁrea: " + payload.area) : "") +
          "\nUrgencia: " + (payload.urgency || "") +
          "\nReportó: " + reporterName +
          "\nProblema: " + (payload.failureDescription || "");
        whatsappUrl = "https://wa.me/" + data.whatsapp + "?text=" + encodeURIComponent(waText);
      }
      renderReportForm(team, msg, whatsappUrl);
    });
  }

  // ---------- Consulta pública de folio ----------
  function renderTicketLookup(team, resultHtml) {
    var app = document.getElementById("app");
    app.innerHTML =
      '<div class="report-page"><div class="report-card">' +
        '<span class="brand-mark" style="font-size:32px;">§</span>' +
        '<h1 class="panel-title">Consultar mi folio</h1>' +
        (resultHtml || '<p class="hint">Escribe el folio que te dieron al reportar (ej. HEMCI-2026-0001).</p>') +
        '<form id="lookup-form">' +
          '<label>Folio<input type="text" name="folio" required placeholder="HEMCI-2026-0001" /></label>' +
          '<button type="submit" class="btn-primary" style="width:100%;">Consultar</button>' +
        '</form>' +
        '<p style="text-align:center; margin-top:16px;"><a href="#" id="goto-report" class="link-btn">← Volver a reportar algo</a></p>' +
      '</div></div>';
    document.getElementById("goto-report").addEventListener("click", function(e){ e.preventDefault(); renderReportForm(team); });
    document.getElementById("lookup-form").addEventListener("submit", async function(e){
      e.preventDefault();
      var folio = new FormData(e.target).get("folio").trim();
      if (!folio) return;
      try {
        var res = await fetch(PUBLIC_BASE + "ticket-status?folio=" + encodeURIComponent(folio), { credentials: "same-origin" });
        var data = await res.json();
        if (!res.ok) { renderTicketLookup(team, '<p class="hint" style="color:var(--stamp-red);">' + escapeHtml(data.error || "No se encontró ese folio.") + '</p>'); return; }
        var statusLabel = data.status === "resuelto" ? "Resuelto" : "Abierto (en proceso)";
        var html =
          '<div class="card" style="text-align:left;">' +
            '<p><strong>Folio:</strong> ' + escapeHtml(data.folio) + '</p>' +
            '<p><strong>Estado:</strong> ' + statusLabel + '</p>' +
            '<p><strong>Equipo:</strong> ' + escapeHtml(data.device) + '</p>' +
            (data.area ? '<p><strong>Área:</strong> ' + escapeHtml(data.area) + '</p>' : '') +
            '<p><strong>Reportado:</strong> ' + formatDateTimeMX(data.createdAt) + '</p>' +
            (data.status === "resuelto" ? ('<p><strong>Solución:</strong> ' + escapeHtml(data.resolution || "") + '</p>') : '<p class="hint">Todavía lo estamos atendiendo.</p>') +
          '</div>';
        renderTicketLookup(team, html);
      } catch (err) {
        renderTicketLookup(team, '<p class="hint" style="color:var(--stamp-red);">No se pudo consultar, revisa tu conexión.</p>');
      }
    });
  }

  // ---------- Login ----------
  async function renderLogin(errorMsg) {
    var app = document.getElementById("app");
    var team = [];
    try {
      var res = await fetch(PUBLIC_BASE + "team-names");
      if (res.ok) team = await res.json();
    } catch (e) {}
    var options = team.map(function(m){ return '<option value="' + m.id + '">' + escapeHtml(m.name) + '</option>'; }).join("");
    app.innerHTML =
      '<div class="report-page"><div class="report-card">' +
        '<span class="brand-mark" style="font-size:32px;">§</span>' +
        '<h1 class="panel-title">Entrar</h1>' +
        (errorMsg ? '<div class="toast toast-error" style="position:static; display:flex; margin-bottom:14px;">' + escapeHtml(errorMsg) + '</div>' : '') +
        '<form id="login-form">' +
          '<label>Usuario<input type="text" name="username" required autocomplete="username" /></label>' +
          '<label>Contraseña<input type="password" name="password" required autocomplete="current-password" /></label>' +
          '<button type="submit" class="btn-primary" style="width:100%;">Entrar</button>' +
        '</form>' +
        '<details style="margin-top:18px;"><summary class="hint" style="cursor:pointer;">¿Primera vez? Configura tu acceso</summary>' +
          '<form id="bootstrap-form" style="margin-top:12px;">' +
            '<label>¿Quién eres?<select name="memberId">' + options + '</select></label>' +
            '<label>Elige un usuario<input type="text" name="username" required autocomplete="username" /></label>' +
            '<label>Elige una contraseña<input type="password" name="password" id="bootstrap-password" required minlength="10" autocomplete="new-password" /></label>' +
            '<div class="hint" id="bootstrap-pw-hint" style="margin:-6px 0 8px;">Mínimo 10 caracteres, con mayúscula, minúscula, número y símbolo.</div>' +
            '<button type="submit" class="btn-secondary" style="width:100%;">Configurar acceso</button>' +
          '</form>' +
        '</details>' +
      '</div></div>';
    wirePasswordHint("bootstrap-password", "bootstrap-pw-hint");
    document.getElementById("login-form").addEventListener("submit", async function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      try {
        var res2 = await fetch(AUTH_BASE + "login", {
          method: "POST", credentials: "same-origin",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") })
        });
        var data = await res2.json().catch(function(){ return {}; });
        if (res2.ok && data.ok) { state.sessionExpiredHandled = false; state.authId = data.id; state.authName = data.name; init(); }
        else { renderLogin(data.error || "No se pudo entrar."); }
      } catch (err) { renderLogin("No se pudo conectar. Revisa tu conexión."); }
    });
    var bf = document.getElementById("bootstrap-form");
    if (bf) bf.addEventListener("submit", async function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      if (!isStrongPasswordClient(fd.get("password"))) {
        renderLogin("La contraseña debe tener al menos 10 caracteres, con mayúscula, minúscula, número y símbolo.");
        return;
      }
      try {
        var res3 = await fetch(AUTH_BASE + "bootstrap", {
          method: "POST", credentials: "same-origin",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ memberId: fd.get("memberId"), username: fd.get("username"), password: fd.get("password") })
        });
        var data2 = await res3.json().catch(function(){ return {}; });
        if (res3.ok && data2.ok) { renderLogin("Acceso configurado. Ahora inicia sesión."); }
        else { renderLogin(data2.error || "No se pudo configurar el acceso."); }
      } catch (err) { renderLogin("No se pudo conectar. Revisa tu conexión."); }
    });
  }
  async function initAuthGate() {
    var app = document.getElementById("app");
    app.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><p>Verificando acceso…</p></div>';
    try {
      var res = await fetch(AUTH_BASE + "me", { credentials: "same-origin" });
      var data = await res.json();
      if (data.loggedIn) { state.authId = data.id; state.authName = data.name; init(); } else { renderLogin(); }
    } catch (e) { renderLogin("No se pudo verificar tu sesión. Intenta de nuevo."); }
  }

  document.addEventListener("DOMContentLoaded", function(){
    if (isReportPath()) { initReportForm(); } else { initAuthGate(); }
  });
</script>
